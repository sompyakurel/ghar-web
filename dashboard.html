  <div class="dash-head">
    <div>

      <p class="dash-email" id="parent-email"></p>
    </div>
    <button class="quiz-next" id="sign-out" style="background:#e0e0e0;color:#333;">Sign out</button>
  </div>
  <p class="error" id="error" hidden>Couldn't load the dashboard. Check your connection and refresh.</p>
  <div id="children-list"></div>
  <div class="auth-card">
    <h2>Add a child</h2>
    <input class="auth-input" id="child-name" type="text" placeholder="Child's first name" maxlength="60">
    <button class="quiz-next" id="add-child">Add child →</button>
    <p class="error" id="add-error" hidden></p>
  </div>
  <p class="auth-note">One unlock covers the whole family. A child's progress is saved to their profile — it follows them across devices. Delete a child any time and their data goes with them. <a href="certificate.html?preview">Preview the certificate →</a></p>

<script src="auth.js?v=9"></script>
<script src="shop-data.js"></script>
<script>
if (!GharAuth.signedIn()) location.href = "signin.html";
// Teen missions live in missions.html, not in the pack JSON — same 8 as the
// app, same titles, so the dashboard can name them.
const TEEN_MISSIONS = [
  { id: "teen-text-it", en: "Text It For Real", ne: "साँच्चै मेसेज गर" },
  { id: "teen-teach-slang", en: "Teach the Slang", ne: "स्ल्याङ सिकाऊ" },
  { id: "teen-caption", en: "Caption That", ne: "क्याप्सन लेख" },
  { id: "teen-comeback", en: "Comeback Ready", ne: "जवाफ दिन सिक" },
  { id: "teen-lyrics", en: "Lyrics Check", ne: "गीतको अर्थ" },
  { id: "teen-order", en: "Order in Nepali", ne: "नेपालीमा अर्डर" },
  { id: "teen-call-home", en: "Call Home", ne: "घरमा फोन" },
  { id: "teen-teach-back", en: "Teach It Back", ne: "सिकाएर देखाऊ" }
];
let pack = null;
const SHOP_BY_ID = {};
if (typeof SHOP !== "undefined") SHOP.forEach(s => SHOP_BY_ID[s.id] = s);
const MYSTERY_BY_ID = {};
if (typeof MYSTERY !== "undefined") MYSTERY.forEach(s => MYSTERY_BY_ID[s.id] = s);

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function chips(items, emptyText) {
  if (!items.length) return `<p class="done-none">${emptyText}</p>`;
  return `<div class="done-chips">${items.map(t => `<span class="done-chip">${t}</span>`).join("")}</div>`;
}
function statRow(label, value) {
  return `<div class="stat-row"><span>${label}</span><b>${value}</b></div>`;
}

async function load() {
  try {
    const me = await GharAuth.api("/accounts/me");
    document.getElementById("parent-email").textContent = "Signed in as " + me.email;
    pack = await (await fetch("data/nepal-v1.json")).json();
    const list = document.getElementById("children-list");
    if (me.children.length === 0) {
      list.innerHTML = `<p class="auth-note">No children yet — add one below to get started.</p>`;
      return;
    }
    // Mission titles: pack missions + the 8 teen missions.
    const missionTitles = {};
    pack.missions.forEach(m => missionTitles[m.id] = { en: m.title_en, ne: m.title_ne });
    TEEN_MISSIONS.forEach(m => missionTitles[m.id] = { en: m.en, ne: m.ne });
    const missionOrder = pack.missions.map(m => m.id).concat(TEEN_MISSIONS.map(m => m.id));
    const totalMissions = missionOrder.length;

    list.innerHTML = "";
    for (const child of me.children) {
      const [p, missions, shop, mystery, streak, quizStats] = await Promise.all([
        GharAuth.api("/accounts/children/" + child.id + "/progress"),
        GharAuth.api("/accounts/children/" + child.id + "/missions"),
        GharAuth.api("/accounts/children/" + child.id + "/shop"),
        GharAuth.api("/accounts/children/" + child.id + "/mystery"),
        // Streak + quiz stats are synced per child (auth.js GharStreak and
        // quiz.html) — a missing row just means no activity yet.
        GharAuth.api("/accounts/children/" + child.id + "/streak").catch(() => ({})),
        GharAuth.api("/accounts/children/" + child.id + "/quiz-stats").catch(() => ({}))
      ]);
      // Lessons done: a deck is done when every word in it has been heard.
      const doneDecks = pack.decks.filter(deck => (p.heard[deck.id] || []).length >= deck.words.length);
      const done = doneDecks.length;
      const missionIds = Object.keys(missions);
      const verifiedCount = missionIds.filter(id => missions[id] === "verified").length;
      const active = GharAuth.childId() === child.id;

      const card = document.createElement("div");
      card.className = "child-card" + (active ? " active" : "");
      let html = `
        <div class="child-top">
          <div class="child-info">
            <span class="child-name">${esc(child.name)}</span>
            <span class="child-progress">⭐ ${child.xp} XP · 📜 ${done} of ${pack.decks.length} lessons done</span>
          </div>
          <button class="quiz-next child-play">${active ? "✓ Learning as " + esc(child.name) : "Learn as " + esc(child.name) + " →"}</button>
        </div>
        <div class="child-progress">
          <h3>Progress</h3>
          ${statRow("Total XP", child.xp)}
          ${statRow("Lessons done", done + " of " + pack.decks.length)}
          ${statRow("Missions completed", missionIds.length + " of " + totalMissions + (verifiedCount ? " · " + verifiedCount + " ⭐ verified" : ""))}`;
      // Quiz + day streak are synced to the server per child, so the
      // parent sees them for every child here — not just the one playing
      // on this browser.
      const quizCorrect = parseInt(quizStats.correct_total || "0", 10) || 0;
      const quizBest = parseInt(quizStats.streak_best || "0", 10) || 0;
      const dayStreak = parseInt(streak.count || "0", 10) || 0;
      html += `
          ${statRow("Quiz answers right", quizCorrect)}
          ${statRow("Best quiz streak", quizBest + " in a row")}
          ${statRow("Day streak", dayStreak === 1 ? "1 day" : dayStreak + " days")}
          <p class="device-note">Quiz answers, best streak, and day streak sync across devices.</p>`;
      // What was actually completed — the lessons, missions, shop buys, and
      // treasures, by name.
      html += `
          <h4>Lessons completed</h4>
          ${chips(doneDecks.map(d => "✓ " + esc(d.title)), "No lessons finished yet.")}
          <h4>Missions completed</h4>
          ${chips(missionOrder.filter(id => missions[id]).map(id => {
            const t = missionTitles[id] || { en: id, ne: "" };
            return (missions[id] === "verified" ? "⭐ " : "✓ ") + esc(t.en) + (t.ne ? " · " + esc(t.ne) : "");
          }), "No missions finished yet.")}
          <h4>Shop items owned</h4>
          ${chips((shop.items || []).map(id => {
            const s = SHOP_BY_ID[id];
            return s ? s.emoji + " " + esc(s.ne) + " — " + esc(s.en) : esc(id);
          }), "Nothing bought from the shop yet.")}
          <h4>Mystery treasures earned</h4>
          ${chips((mystery.items || []).map(id => {
            const s = MYSTERY_BY_ID[id];
            return s ? s.emoji + " " + esc(s.ne) + " — " + esc(s.en) : esc(id);
          }), "No Mystery Box treasures yet — one box is earned per 3 lessons.")}`;
      if (p.cert_earned_at) {
        const d = new Date(p.cert_earned_at * 1000).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        html += `<p class="cert-line">📜 Certificate earned ${d}</p>`;
      }
      html += `</div>`;
      card.innerHTML = html;
      card.querySelector(".child-play").addEventListener("click", async () => {
        localStorage.setItem(CHILD_KEY, child.id);
        try { await GharAuth.carryOver(); } catch (e) { /* progress sync failed — still open the game */ }
        location.href = "index.html";
      });
      list.appendChild(card);
    }
  } catch (e) {
    document.getElementById("error").hidden = false;
  }
}
document.getElementById("sign-out").addEventListener("click", () => GharAuth.signOut());
document.getElementById("add-child").addEventListener("click", async () => {
  const name = document.getElementById("child-name").value.trim();
  const err = document.getElementById("add-error");
  err.hidden = true;
  if (!name) { err.hidden = false; err.textContent = "Type the child's first name."; return; }
  try {
    const child = await GharAuth.api("/accounts/children", "POST", { name });
    localStorage.setItem(CHILD_KEY, child.id);
    await GharAuth.carryOver();
    location.href = "index.html";
  } catch (e) {
    err.hidden = false;
    err.textContent = "Couldn't add the child. Try again.";
  }
});
document.getElementById("child-name").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("add-child").click();
});
load();
</script>
