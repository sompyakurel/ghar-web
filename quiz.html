<script>
const TIERS = { beginner: "🌱 Beginner", intermediate: "🌿 Intermediate", hard: "🌳 Hard", teen: "🔥 Teen" };
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  if (q.has("test")) localStorage.setItem("ghar.testUnlock", q.get("test") === "off" ? "" : "1");
  return localStorage.getItem("ghar.testUnlock") === "1";
}
const TEST = isTestUnlock();
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
const FREE_LIMIT = 5;
let xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
let freeUsed = parseInt(localStorage.getItem("ghar.quiz.freeUsed") || "0", 10);
let quizCorrect = parseInt(localStorage.getItem("ghar.quiz.correctTotal") || "0", 10);
let quizStreak = parseInt(localStorage.getItem("ghar.quiz.streak") || "0", 10);
let quizStreakBest = parseInt(localStorage.getItem("ghar.quiz.streakBest") || "0", 10);
function saveXP() { localStorage.setItem("ghar.xp.total", String(xp)); }
// The balance this page shows is the spendable wallet (lifetime minus
// what has been spent), matching the home page, the map and the shop -
// xp above stays the lifetime total that awards keep adding to.
function dispXP() {
  if (window.GharAuth && GharAuth.spendable) return GharAuth.spendable();
  return Math.max(xp - (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0), 0);
}
function saveFree() { localStorage.setItem("ghar.quiz.freeUsed", String(freeUsed)); }
function saveQuizStats() {
  localStorage.setItem("ghar.quiz.correctTotal", String(quizCorrect));
  localStorage.setItem("ghar.quiz.streak", String(quizStreak));
  localStorage.setItem("ghar.quiz.streakBest", String(quizStreakBest));
}
// Cross-device quiz stats: the server keeps the best streak and total
// correct answers per child. Pull on load and take the max — never wipe
// local progress. (The current streak and last section stay on this
// device; only the best + total sync.)
async function pullQuizStats() {
  if (!GharAuth.signedIn() || !GharAuth.childId()) return;
  try {
    const s = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/quiz-stats");
    if (!s) return;
    const serverBest = parseInt(s.streak_best || "0", 10) || 0;
    const serverTotal = parseInt(s.correct_total || "0", 10) || 0;
    const best = Math.max(quizStreakBest, serverBest);
    const total = Math.max(quizCorrect, serverTotal);
    localStorage.setItem("ghar.quiz.streakBest", String(best));
    localStorage.setItem("ghar.quiz.correctTotal", String(total));
    quizStreakBest = best;
    quizCorrect = total;
    // Push the merged state back when the local side is ahead — a best streak
    // / correct total built before the sync existed (server empty or lower)
    // otherwise never reaches the database, and the dashboard keeps showing 0.
    if (best > serverBest || total > serverTotal) {
      GharAuth.api("/accounts/children/" + GharAuth.childId() + "/quiz-stats", "POST", { streak_best: best, correct_total: total }).catch(() => {});
    }
  } catch (e) { /* guest or offline — local stats stand */ }
}
const player = new Audio();
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playDing() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [[880, 0.25], [1318, 0.12]].forEach(([freq, vol]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(g).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.9);
    });
  } catch (e) {}
}
const WRONG_CLIPS = ["feedback_vayena_1_np.m4a", "feedback_vayena_2_np.m4a"];
const TEEN_WRONG_CLIPS = ["feedback_teen_wrong_1_np.m4a", "feedback_teen_wrong_2_np.m4a", "feedback_teen_wrong_3_np.m4a"];
const feedbackPlayer = new Audio();
function playWrongFeedback(isTeen) {
  const clips = isTeen ? TEEN_WRONG_CLIPS : WRONG_CLIPS;
  const file = clips[Math.floor(Math.random() * clips.length)];
  feedbackPlayer.pause();
  feedbackPlayer.src = "assets/audio/nepal-v1/" + file;
  feedbackPlayer.play().catch(() => {});
}
let pack = null;
let sections = [];
let section = null;
let queue = [];
let current = null;
let options = [];
let solved = false;
let wrongIDs = new Set();
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function wordsFor(id) {
  const d = pack.decks.find(x => x.id === id);
  return d ? d.words : [];
}
function wordsForTier(tier, exclude) {
  return pack.decks.filter(d => (d.difficulty || "beginner") === tier && !exclude.includes(d.id)).flatMap(d => d.words);
}
function buildSections() {
  return [
    { tier: "beginner", title: "Words", icon: "💬", words: wordsForTier("beginner", ["animals", "colors"]), mode: "listen" },
    { tier: "beginner", title: "Animals", icon: "🐾", words: wordsFor("animals"), mode: "listen" },
    { tier: "beginner", title: "Colors", icon: "🎨", words: wordsFor("colors"), mode: "listen" },
    { tier: "intermediate", title: "Words", icon: "📚", words: wordsForTier("intermediate", []), mode: "listen" },
    { tier: "hard", title: "Words", icon: "🧠", words: wordsForTier("hard", ["dashain", "tihar", "months"]), mode: "listen" },
    { tier: "hard", title: "Months", icon: "📅", words: wordsFor("months"), mode: "listen" },
    { tier: "hard", title: "Dashain", icon: "🪔", words: wordsFor("dashain"), mode: "picture" },
    { tier: "hard", title: "Tihar", icon: "✨", words: wordsFor("tihar"), mode: "picture" },
    { tier: "teen", title: "Text Pack", icon: "💬", words: wordsFor("texting"), mode: "listen" },
    { tier: "teen", title: "Slang", icon: "🔥", words: wordsFor("slang"), mode: "listen" },
    { tier: "teen", title: "Comebacks", icon: "💥", words: wordsFor("comebacks"), mode: "listen" },
    { tier: "teen", title: "Captions", icon: "📸", words: wordsFor("captions"), mode: "listen" },
    { tier: "teen", title: "Lyrics", icon: "🎵", words: wordsFor("lyrics"), mode: "listen" },
  ].filter(s => s.words.length > 0);
}
function freeLeft() { return TEST ? "unlimited" : `${FREE_LIMIT - freeUsed} of ${FREE_LIMIT} free left`; }
function showMenu() {
  section = null;
  const content = document.getElementById("content");
  let html = `<div class="deck-head"><h1>🎮 Pick a quiz</h1><p>+5 XP per correct answer · ⭐ ${dispXP()} XP · ${freeLeft()}</p></div>`;
  ["beginner", "intermediate", "hard", "teen"].forEach(tier => {
    const secs = sections.filter(s => s.tier === tier);
    if (!secs.length) return;
    html += `<h2 class="quiz-tier">${TIERS[tier] || tier}</h2><div class="quiz-sections">`;
    secs.forEach((s, i) => {
      const idx = sections.indexOf(s);
      html += `<button type="button" class="quiz-card" data-idx="${idx}"><div class="icon">${s.icon}</div><h3>${esc(s.title)}</h3><p>${s.words.length} words${s.mode === "picture" ? " · picture quiz" : ""}</p></button>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html;
  content.querySelectorAll(".quiz-card").forEach(btn => {
    btn.addEventListener("click", () => startQuiz(sections[parseInt(btn.dataset.idx, 10)]));
  });
}
function showLock() {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="quiz-lock"><div class="big">🔒</div><h1>You've used your 5 free questions!</h1><p>Unlock unlimited quizzes with Ghar Premium.</p><button type="button" class="quiz-next" id="lock-menu">← Back to quiz menu</button></div>`;
  document.getElementById("lock-menu").addEventListener("click", showMenu);
  document.getElementById("blitz-keep-going").addEventListener("click", () => {
    document.getElementById("blitz-celebration").hidden = true;
  });
}
function startQuiz(sec) {
  section = sec;
  // Remember this section so the next visit jumps straight back into it.
  try { localStorage.setItem("ghar.quiz.lastSection", String(sections.indexOf(sec))); } catch (e) {}
  queue = [];
  newQuestion();
}
function playCurrent() {
  if (!current || !current.has_audio || !current.audio_url) return;
  player.pause();
  player.src = asset(current.audio_url);
  player.play().catch(() => {});
}
function newQuestion() {
  // The 5-free-question limit applies to the free tier only. A family
  // unlocked via Stripe (server flag) has unlimited quiz questions.
  if (!TEST && !GharAuth.isUnlocked() && freeUsed >= FREE_LIMIT) { showLock(); return; }
  if (!TEST && !GharAuth.isUnlocked()) { freeUsed += 1; saveFree(); GharAuth.pushTotals().catch(() => {}); }
  const pool = section.words.filter(w => section.mode === "picture" ? w.image : (w.has_audio !== false));
  if (queue.length === 0) {
    queue = shuffle(pool.filter(w => !current || w.id !== current.id));
    if (queue.length === 0) queue = shuffle(pool);
  }
  if (queue.length === 0) { showMenu(); return; }
  current = queue.shift();
  const distractors = shuffle(pool.filter(w => w.id !== current.id)).slice(0, 3);
  options = shuffle([current, ...distractors]);
  solved = false;
  wrongIDs = new Set();
  renderPlayer();
  if (section.mode === "listen") playCurrent();
}
function optionHTML(opt) {
  if (opt.color_hex) {
    return `<div class="quiz-swatch" style="background:${esc(opt.color_hex)}"></div>`;
  }
  if (section.mode === "picture") {
    return `<div><div class="opt-deva">${esc(opt.devanagari)}</div><div class="opt-sub">${esc(opt.english)}</div></div>`;
  }
  const img = opt.image ? `<img src="${esc(asset(opt.image))}" alt="" onerror="this.style.display='none'">` : "";
  return `${img}<div class="opt-eng">${esc(opt.english)}</div>`;
}
function renderPlayer() {
  const content = document.getElementById("content");
  const isPicture = section.mode === "picture";
  const stake = wrongIDs.size === 0 ? "⭐ +5 XP" : "😅 +2 XP now";
  const stakeClass = wrongIDs.size === 0 ? "good" : "low";
  let questionHTML = "";
  if (isPicture) {
    const img = current.image ? `<img class="quiz-picture" src="${esc(asset(current.image))}" alt="">` : "";
    const hint = current.quiz_hint ? `<p class="quiz-hint">${esc(current.quiz_hint)}</p>` : "";
    questionHTML = `${img}${hint}`;
  } else {
    questionHTML = `<button type="button" class="quiz-play" id="play-word">🔊 Play word</button>`;
  }
  const optsHTML = options.map((opt, i) => {
    const isSwatch = !!opt.color_hex;
    return `<button type="button" class="quiz-option${isSwatch ? " swatch-btn" : ""}" data-i="${i}">${optionHTML(opt)}</button>`;
  }).join("");
  content.innerHTML = `
    <div class="quiz-player">
      <button type="button" class="quiz-back" id="quiz-back">← Quiz menu</button>
      <h1>${section.icon} ${esc(section.title)}</h1>
      <p class="quiz-xp">⭐ ${dispXP()} XP · ${freeLeft()}</p>
      <p class="quiz-prompt">${isPicture ? "What is this?" : "What did you hear?"}</p>
      ${questionHTML}
      <p class="quiz-stake ${stakeClass}" id="stake">${stake}</p>
      <p class="quiz-feedback" id="feedback"></p>
      <div class="celebrate" id="celebrate"></div>
      <div class="quiz-options">${optsHTML}</div>
      <button type="button" class="quiz-next" id="next-word" hidden>Next word →</button>
    </div>`;
  document.getElementById("quiz-back").addEventListener("click", () => { player.pause(); showMenu(); });
  if (!isPicture) document.getElementById("play-word").addEventListener("click", playCurrent);
  content.querySelectorAll(".quiz-option").forEach(btn => {
    btn.addEventListener("click", () => answer(parseInt(btn.dataset.i, 10), btn));
  });
  document.getElementById("next-word").addEventListener("click", newQuestion);
}
function answer(i, btn) {
  if (solved) return;
  const opt = options[i];
  if (opt.id === current.id) {
    solved = true;
    const earned = wrongIDs.size === 0 ? 5 : 2;
    xp += earned;
    saveXP();
    if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(earned);
    quizCorrect++;
    quizStreak++;
    if (quizStreak > quizStreakBest) quizStreakBest = quizStreak;
    saveQuizStats();
    // Sync the new best + total to the server (max-merged there too).
    if (GharAuth.signedIn() && GharAuth.childId()) {
      GharAuth.api("/accounts/children/" + GharAuth.childId() + "/quiz-stats", "POST", { streak_best: quizStreakBest, correct_total: quizCorrect }).catch(() => {});
    }
    // Daily Quiz Blitz: 5 correct answers in one day finishes the daily
    // challenge (+15 XP) and keeps the streak alive. (Matches the app.)
    // When it completes, show a celebration overlay that STOPS the quiz —
    // before this, the quiz just carried on to the next question and the
    // daily challenge never visibly ended.
    let blitz = false;
    if (typeof GharStreak !== "undefined") {
      GharStreak.recordQuizSolve();
      if (GharStreak.checkBlitzComplete()) {
        blitz = true; xp += 15; saveXP();
        if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(15);
        const n = GharStreak.count();
        document.getElementById("blitz-celebration-sub").textContent =
          `Daily challenge done! +15 XP · 🔥 ${n} day${n === 1 ? "" : "s"} streak`;
        document.getElementById("blitz-celebration").hidden = false;
      }
    }
    GharAuth.pushTotals().catch(() => {});
    if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
    playDing();
    btn.classList.add("correct");
    document.getElementById("celebrate").textContent = "🎉";
    const fb = document.getElementById("feedback");
    fb.textContent = blitz ? `✅ Correct! +${earned} XP · ⚡ Quiz Blitz complete! +15 XP` : `✅ Correct! +${earned} XP`;
    fb.className = "quiz-feedback good";
    document.querySelector(".quiz-xp").textContent = `⭐ ${dispXP()} XP · ${freeLeft()}`;
    document.querySelectorAll(".quiz-option").forEach(b => { b.disabled = true; });
    document.getElementById("next-word").hidden = false;
  } else {
    wrongIDs.add(opt.id);
    quizStreak = 0;
    saveQuizStats();
    playWrongFeedback(section.tier === "teen");
    btn.classList.add("wrong");
    btn.disabled = true;
    const stake = document.getElementById("stake");
    stake.textContent = "😅 +2 XP now";
    stake.className = "quiz-stake low";
    const fb = document.getElementById("feedback");
    fb.textContent = "✗ Not quite — try again!";
    fb.className = "quiz-feedback bad";
  }
}
GharAuth.pull().catch(() => {}).then(() => pullQuizStats().catch(() => {})).then(() => GharAuth.refreshUnlock().catch(() => false)).then(() => fetch("data/nepal-v1.json?v=4"))
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(p => {
    xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
    freeUsed = parseInt(localStorage.getItem("ghar.quiz.freeUsed") || "0", 10);
    pack = p;
    sections = buildSections();
    document.title = "Ghar — Quiz";
    // ?menu=1 (top-nav Quiz pill) opens the picker instead of jumping
    // straight into a quiz. Otherwise jump straight in: resume the last
    // section, or the first one. ("← Quiz menu" inside the quiz changes
    // sections.) A ?section=<index> link can force a specific one.
    const q = new URLSearchParams(location.search);
    if (q.has("menu")) {
      showMenu();
    } else {
      let startIdx = 0;
      if (q.has("section")) {
        const pi = parseInt(q.get("section"), 10);
        if (!isNaN(pi) && pi >= 0 && pi < sections.length) startIdx = pi;
      } else {
        const saved = parseInt(localStorage.getItem("ghar.quiz.lastSection") || "", 10);
        if (!isNaN(saved) && saved >= 0 && saved < sections.length) startIdx = saved;
      }
      if (!TEST && !GharAuth.isUnlocked() && freeUsed >= FREE_LIMIT) showMenu();
      else startQuiz(sections[startIdx]);
    }
  })
  .catch(() => { document.getElementById("error").hidden = false; });
