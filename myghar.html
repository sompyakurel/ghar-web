<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar — My Ghar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Home</a>
  <div class="myghar-head">
    <div>
      <h1>🏠 <span id="house-name-label">My Ghar</span></h1>
      <p class="myghar-sub"><span id="dog-name-label">Bhunte</span> · <span id="dog-stage-label">Puppy</span> · ⭐ <span id="xp-label">0</span> XP</p>
    </div>
    <button class="quiz-next" id="arrange-btn">🧱 Arrange</button>
  </div>
  <div class="myghar-stage" id="stage">
    <img class="myghar-bg" src="assets/images/myghar/room_bg.png" alt="My Ghar room">
    <div class="myghar-night" id="night-tint" hidden></div>
    <div class="myghar-weather" id="weather">…</div>
    <div id="decorations"></div>
    <img class="myghar-dog" id="dog" src="assets/images/bhunte.svg" alt="Bhunte the dog">
    <div class="myghar-dog-name" id="dog-name-tag">Bhunte</div>
  </div>
  <p class="myghar-hint" id="hint">Tap Bhunte and he'll bark! 🐶</p>
  <div class="myghar-earn" id="earn-box">
    <h3>🎁 Earn decorations for your room</h3>
    <p class="myghar-earn-sub">Your room starts empty. Every decoration here is earned by learning — nothing is just given.</p>
    <ul id="earn-list"></ul>
  </div>
  <div class="myghar-names">
    <label>House name <input class="auth-input" id="house-name" type="text" placeholder="My Ghar" maxlength="30"></label>
    <label>Dog's name <input class="auth-input" id="dog-name" type="text" placeholder="Bhunte" maxlength="20"></label>
  </div>
  <div class="celebration" id="celebration" hidden>
    <div class="confetti" id="confetti"></div>
    <div class="celebration-card">
      <img class="celebration-dog" src="assets/images/bhunte.svg" alt="Bhunte">
      <div class="celebration-emoji">🎉</div>
      <div class="celebration-title" id="celebration-title">Bhunte grew!</div>
      <div class="celebration-sub" id="celebration-sub"></div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
// My Ghar: the room starts EMPTY. Decorations are EARNED, never pre-placed.
// Bhunte is the Figma Bhunte (assets/images/bhunte.svg) — the real Bhunte.
// He grows by getting BIGGER as he earns XP (one dog, scaled up), not by
// swapping to a different sprite. Puppy 20% wide, Young 25%, Big 30%.
const EARNED = [
  { id: "goldenDiyo", x: 0.155, y: 0.270, w: 14,
    label: "🪔 Golden Diyo — complete all 10 missions",
    earned: s => s.missionsDone >= 10 },
  { id: "starBadge", x: 0.835, y: 0.370, w: 14,
    label: "⭐ Star Badge — earn 100 XP",
    earned: s => s.xp >= 100 },
  { id: "mukut", x: 0.490, y: 0.153, w: 18,
    label: "👑 Mukut (crown) — complete all 22 lessons",
    earned: s => s.decksDone >= 22 },
];
const STAGE_NAMES = ["Puppy", "Young Dog", "Big Dog"];
const STAGE_WIDTH = [20, 25, 30]; // % of the stage width, per stage
const LAYOUT_KEY = "ghar.myghar.layout";
const DOG_STAGE_KEY = "ghar.dog.stage";
const DOG_NAME_KEY = "ghar.dog.name";
const HOUSE_NAME_KEY = "ghar.house.name";
let arranging = false;
let layout = {};
try { layout = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}"); } catch (e) { layout = {}; }
function saveLayout() { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); }
const player = new Audio();
function play(url) { player.pause(); player.src = url; player.play().catch(() => {}); }
function spawnConfetti() {
  const box = document.getElementById("confetti");
  if (!box) return;
  box.innerHTML = "";
  const colors = ["#ff5252", "#ffb300", "#00c853", "#0091ff", "#aa00ff", "#ff4081"];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.5) + "s";
    piece.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    box.appendChild(piece);
  }
}
function showCelebration(title, sub) {
  document.getElementById("celebration-title").textContent = title;
  document.getElementById("celebration-sub").textContent = sub;
  const c = document.getElementById("celebration");
  c.hidden = false;
  spawnConfetti();
  setTimeout(() => { c.hidden = true; }, 3000);
}
document.getElementById("celebration").addEventListener("click", () => {
  document.getElementById("celebration").hidden = true;
});
function dogStageFor(xp) { return xp >= 150 ? 2 : xp >= 50 ? 1 : 0; }
function readState() {
  const xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
  let missionsDone = 0;
  try {
    const c = JSON.parse(localStorage.getItem("ghar.missions.completed") || "[]");
    const v = JSON.parse(localStorage.getItem("ghar.missions.verified") || "[]");
    missionsDone = new Set([...c, ...v]).size;
  } catch (e) { missionsDone = 0; }
  let decksDone = 0;
  try {
    const pack = JSON.parse(localStorage.getItem("ghar.pack.cache") || "null");
    if (pack && pack.decks) {
      decksDone = pack.decks.filter(d => {
        try {
          const heard = JSON.parse(localStorage.getItem("ghar.heard." + d.id) || "[]");
          return heard.length >= (d.words || []).length && (d.words || []).length > 0;
        } catch (e) { return false; }
      }).length;
    }
  } catch (e) { decksDone = 0; }
  return { xp, missionsDone, decksDone };
}
function renderDecorations(state) {
  const wrap = document.getElementById("decorations");
  wrap.innerHTML = "";
  const shown = EARNED.filter(d => d.earned(state));
  shown.forEach(d => {
    const delta = layout[d.id] || [0, 0];
    const el = document.createElement("img");
    el.src = `assets/images/myghar/${d.id}.png`;
    el.alt = d.id;
    el.className = "myghar-deco" + (arranging ? " arranging" : "");
    el.dataset.id = d.id;
    el.style.width = d.w + "%";
    el.style.left = ((d.x + delta[0]) * 100) + "%";
    el.style.top = ((d.y + delta[1]) * 100) + "%";
    el.addEventListener("click", () => {
      if (arranging) return;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      play(`assets/audio/nepal-v1/myghar_${d.id}_np.m4a`);
    });
    makeDraggable(el, d);
    wrap.appendChild(el);
  });
  document.getElementById("hint").textContent = shown.length === 0
    ? "Your room is empty — earn decorations by learning! Tap Bhunte and he'll bark! 🐶"
    : "Tap a decoration to hear it. Tap Bhunte and he'll bark! 🐶";
  const list = document.getElementById("earn-list");
  list.innerHTML = "";
  EARNED.forEach(d => {
    const li = document.createElement("li");
    li.textContent = (d.earned(state) ? "✅ " : "⬜ ") + d.label;
    list.appendChild(li);
  });
  document.getElementById("earn-box").style.display = shown.length >= EARNED.length ? "none" : "";
}
function makeDraggable(el, d) {
  el.addEventListener("pointerdown", e => {
    if (!arranging) return;
    e.preventDefault();
    const stage = document.getElementById("stage");
    const rect = stage.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const base = layout[d.id] || [0, 0];
    const origLeft = d.x + base[0], origTop = d.y + base[1];
    function onMove(ev) {
      const dx = (ev.clientX - startX) / rect.width;
      const dy = (ev.clientY - startY) / rect.height;
      const nx = Math.min(0.95, Math.max(0.05, origLeft + dx));
      const ny = Math.min(0.95, Math.max(0.05, origTop + dy));
      el.style.left = (nx * 100) + "%";
      el.style.top = (ny * 100) + "%";
      el._pending = [nx - d.x, ny - d.y];
    }
    function onUp() {
      if (el._pending) {
        layout[d.id] = el._pending;
        saveLayout();
        delete el._pending;
      }
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}
function renderDog(xp) {
  const stage = dogStageFor(xp);
  const dog = document.getElementById("dog");
  dog.style.width = STAGE_WIDTH[stage] + "%";
  document.getElementById("dog-stage-label").textContent = STAGE_NAMES[stage];
  document.getElementById("xp-label").textContent = xp;
  const prev = parseInt(localStorage.getItem(DOG_STAGE_KEY) || "0", 10);
  if (stage > prev) {
    localStorage.setItem(DOG_STAGE_KEY, String(stage));
    const name = localStorage.getItem(DOG_NAME_KEY) || "Bhunte";
    showCelebration(`🎉 ${name} grew!`, `${name} is now a ${STAGE_NAMES[stage]}!`);
    play(stage === 0 ? "assets/audio/nepal-v1/dog_bark.m4a" : "assets/audio/nepal-v1/dog_bark_big.m4a");
  } else {
    localStorage.setItem(DOG_STAGE_KEY, String(stage));
  }
}
function renderNames() {
  const dogName = localStorage.getItem(DOG_NAME_KEY) || "Bhunte";
  const houseName = localStorage.getItem(HOUSE_NAME_KEY) || "My Ghar";
  document.getElementById("dog-name-label").textContent = dogName;
  document.getElementById("dog-name-tag").textContent = dogName;
  document.getElementById("house-name-label").textContent = houseName;
  document.getElementById("dog-name").value = dogName;
  document.getElementById("house-name").value = houseName;
}
function renderDayNight() {
  const hour = new Date().getHours();
  const isDay = hour >= 6 && hour < 18;
  document.getElementById("night-tint").hidden = isDay;
}
async function renderWeather() {
  const el = document.getElementById("weather");
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=39.96&longitude=-82.99&current=temperature_2m,weather_code&temperature_unit=fahrenheit");
    const j = await r.json();
    const code = j.current.weather_code;
    const temp = Math.round(j.current.temperature_2m);
    const emoji = code === 0 ? "☀️" : code <= 2 ? "⛅" : code === 3 ? "☁️" : (code === 45 || code === 48) ? "🌫️" : (code >= 71 && code <= 75) ? "❄️" : code === 95 ? "⛈️" : "🌧️";
    el.textContent = `${emoji} ${temp}°F`;
  } catch (e) {
    el.textContent = "";
  }
}
document.getElementById("dog").addEventListener("click", () => {
  const xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
  const stage = dogStageFor(xp);
  const dog = document.getElementById("dog");
  dog.classList.remove("bounce");
  void dog.offsetWidth;
  dog.classList.add("bounce");
  play(stage === 0 ? "assets/audio/nepal-v1/dog_bark.m4a" : "assets/audio/nepal-v1/dog_bark_big.m4a");
});
document.getElementById("arrange-btn").addEventListener("click", () => {
  arranging = !arranging;
  document.getElementById("arrange-btn").textContent = arranging ? "✅ Done arranging" : "🧱 Arrange";
  const state = readState();
  renderDecorations(state);
});
document.getElementById("dog-name").addEventListener("input", e => {
  localStorage.setItem(DOG_NAME_KEY, e.target.value);
  renderNames();
});
document.getElementById("house-name").addEventListener("input", e => {
  localStorage.setItem(HOUSE_NAME_KEY, e.target.value);
  renderNames();
});
GharAuth.pull().catch(() => {}).then(async () => {
  // Cache the pack so the deck count (for the Mukut) can be read locally.
  try {
    const r = await fetch("data/nepal-v1.json");
    if (r.ok) {
      const pack = await r.json();
      localStorage.setItem("ghar.pack.cache", JSON.stringify({ decks: pack.decks.map(d => ({ id: d.id, words: d.words.map(w => w.id) })) }));
    }
  } catch (e) { /* deck count stays 0 */ }
  const state = readState();
  renderDecorations(state);
  renderDog(state.xp);
  renderNames();
  renderDayNight();
  renderWeather();
}).catch(() => {
  document.getElementById("hint").textContent = "Couldn't load My Ghar. Check your connection and refresh.";
});
</script>
</body>
</html>
