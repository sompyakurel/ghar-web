<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar — My Ghar</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Home</a>
  <div class="myghar-head">
    <div>
      <h1>🏠 <span id="house-name-label">My Ghar</span></h1>
      <p class="myghar-sub"><span id="dog-name-label">Bhunte</span> · <span id="dog-stage-label">Puppy</span> · ⭐ <span id="xp-label">0</span> XP</p>
    </div>
    <a class="quiz-next shop-btn" href="shop.html">🛍️ Shop</a>
    <button class="quiz-next" id="mystery-btn">🎁 Mystery Box</button>
    <button class="quiz-next" id="arrange-btn">🧱 Arrange</button>
  </div>
  <div class="myghar-stage" id="stage">
    <img class="myghar-room" src="assets/images/myghar/room.jpg" alt="My Ghar room">
    <div id="trophies"></div>
    <div class="myghar-sign-name" id="sign-name">Bhunte</div>
    <div class="myghar-night" id="night-tint" hidden></div>
    <div class="myghar-weather" id="weather">…</div>
    <div id="shop-items"></div>
    <img class="myghar-dog" id="dog" src="assets/images/bhunte.svg" alt="Bhunte the dog">
  </div>
  <p class="myghar-hint" id="hint">Tap Bhunte and he'll bark! 🐶</p>
  <div class="myghar-earn" id="earn-box">
    <h3>🎁 Earn decorations for your room</h3>
    <p class="myghar-earn-sub">Your room starts empty. Every decoration here is earned by learning — nothing is just given.</p>
    <ul id="earn-list"></ul>
  </div>
  <div class="myghar-names">
    <label>House name <input class="auth-input" id="house-name" type="text" placeholder="My Ghar" maxlength="30"></label>
    <label>Dog's name <input class="auth-input" id="dog-name" type="text" placeholder="Bhunte" maxlength="20"></label>
  </div>
  <div class="celebration" id="celebration" hidden>
    <div class="confetti" id="confetti"></div>
    <div class="celebration-card">
      <img class="celebration-dog" src="assets/images/bhunte.svg" alt="Bhunte">
      <div class="celebration-emoji">🎉</div>
      <div class="celebration-title" id="celebration-title">Bhunte grew!</div>
      <div class="celebration-sub" id="celebration-sub"></div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script src="shop-data.js"></script>
<script>
// My Ghar -- ONE ROOM PICTURE (v8).
// The room is a single wide image (assets/images/myghar/room.jpg): one
// coherent picture -- wooden trophy cabinet + prayer flags (left), Himalaya
// picture + name sign (center wall), window + marigolds (right), rug on a
// wooden floor. Only the LIVING things sit on top of it: Bhunte (our Figma
// dog), Suga (our parrot), and the earned trophies on the cabinet shelves.
// Slots (fractions of the room picture, measured from the image itself):
//   S1 Trophy cabinet -- 6 cells, 2 per shelf x 3 shelves (boards at
//      y 0.377 / 0.547 / 0.720; cells at x 0.10 / 0.26).
//   W2 Name sign -- the dog's name is written on it (center 0.50, 0.427).
//   F1 Rug -- Bhunte stands on it (feet at y ~0.89, center x 0.475).
//   P1 Perch -- Suga, bottom-right.
// Layers, back to front: room picture, trophies + shop items, dog, name,
// night tint, weather. Bhunte grows by getting BIGGER (one dog, scaled).
// The room starts EMPTY of trophies, shop items AND mystery treasures.
// Trophies appear when earned by learning; shop items (including Suga
// the parrot) appear only after the kid buys them with XP in the Shop;
// mystery treasures (karuwa, charkha, nanglo, khukuri, sarangi, guleyli)
// appear only from a Mystery Box -- one box is earned for every 3 decks
// completed, and opening it reveals a random treasure not yet owned.
// Nothing is just given. Every room item -- trophy, shop piece, treasure,
// Suga -- uses the SAME placement: left/top as % (its CENTER) plus
// translate(-50%,-50%). No more right/bottom pinning.
const EARNED = [
  { id: "goldenDiyo", shelf: 0, cell: 0,
    label: "🪔 Golden Diyo — complete all 10 missions",
    earned: s => s.missionsDone >= 10 },
  { id: "starBadge", shelf: 1, cell: 0,
    label: "⭐ Star Badge — earn 100 XP",
    earned: s => s.xp >= 100 },
  { id: "mukut", shelf: 2, cell: 0,
    label: "👑 Mukut (crown) — complete all 22 lessons",
    earned: s => s.decksDone >= 22 },
];
// Trophy cell centers: 2 cells per shelf (fractions of the ROOM picture).
const CELL_X = [0.10, 0.26];
// Trophy centers: just above each shelf board so the trophy sits ON it.
// Boards are at y 0.377 / 0.547 / 0.720 in the room picture.
const SHELF_Y = [0.345, 0.515, 0.69];
const STAGE_NAMES = ["Puppy", "Young Dog", "Big Dog"];
const STAGE_WIDTH = [20, 25, 30]; // % of the stage width, per stage
const LAYOUT_KEY = "ghar.myghar.layout";
const DOG_STAGE_KEY = "ghar.dog.stage";
const DOG_NAME_KEY = "ghar.dog.name";
const HOUSE_NAME_KEY = "ghar.house.name";
let arranging = false;
let layout = {};
try { layout = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}"); } catch (e) { layout = {}; }
function saveLayout() { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); }
const player = new Audio();
function play(url) { player.pause(); player.src = url; player.play().catch(() => {}); }
function spawnConfetti() {
  const box = document.getElementById("confetti");
  if (!box) return;
  box.innerHTML = "";
  const colors = ["#ff5252", "#ffb300", "#00c853", "#0091ff", "#aa00ff", "#ff4081"];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.5) + "s";
    piece.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    box.appendChild(piece);
  }
}
function showCelebration(title, sub) {
  document.getElementById("celebration-title").textContent = title;
  document.getElementById("celebration-sub").textContent = sub;
  const c = document.getElementById("celebration");
  c.hidden = false;
  spawnConfetti();
  setTimeout(() => { c.hidden = true; }, 3000);
}
document.getElementById("celebration").addEventListener("click", () => {
  document.getElementById("celebration").hidden = true;
});
function dogStageFor(xp) { return xp >= 150 ? 2 : xp >= 50 ? 1 : 0; }
function readState() {
  const xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
  let missionsDone = 0;
  try {
    const c = JSON.parse(localStorage.getItem("ghar.missions.completed") || "[]");
    const v = JSON.parse(localStorage.getItem("ghar.missions.verified") || "[]");
    missionsDone = new Set([...c, ...v]).size;
  } catch (e) { missionsDone = 0; }
  let decksDone = 0;
  try {
    const pack = JSON.parse(localStorage.getItem("ghar.pack.cache") || "null");
    if (pack && pack.decks) {
      decksDone = pack.decks.filter(d => {
        try {
          const heard = JSON.parse(localStorage.getItem("ghar.heard." + d.id) || "[]");
          return heard.length >= (d.words || []).length && (d.words || []).length > 0;
        } catch (e) { return false; }
      }).length;
    }
  } catch (e) { decksDone = 0; }
  return { xp, missionsDone, decksDone };
}
function renderTrophies(state) {
  const wrap = document.getElementById("trophies");
  wrap.innerHTML = "";
  EARNED.filter(d => d.earned(state)).forEach(d => {
    const delta = layout[d.id] || [0, 0];
    const el = document.createElement("img");
    el.src = `assets/images/myghar/${d.id}.png`;
    el.alt = d.id;
    el.className = "myghar-trophy" + (arranging ? " arranging" : "");
    el.dataset.id = d.id;
    el.style.left = ((CELL_X[d.cell] + delta[0]) * 100) + "%";
    el.style.top = ((SHELF_Y[d.shelf] + delta[1]) * 100) + "%";
    el.addEventListener("click", () => {
      if (arranging) return;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      play(`assets/audio/nepal-v1/myghar_${d.id}_np.m4a`);
    });
    makeDraggable(el, d, document.getElementById("stage"));
    wrap.appendChild(el);
  });
  const shown = EARNED.filter(d => d.earned(state)).length;
  const ownedCount = shopOwned().length;
  document.getElementById("hint").textContent = (shown === 0 && ownedCount === 0)
    ? "Your room is empty — earn XP by learning, then buy things for it in the 🛍️ Shop! Tap Bhunte and he'll bark! 🐶"
    : "Tap a trophy or decoration to hear it. Tap Bhunte and he'll bark! 🐶";
  const list = document.getElementById("earn-list");
  list.innerHTML = "";
  EARNED.forEach(d => {
    const li = document.createElement("li");
    li.textContent = (d.earned(state) ? "✅ " : "⬜ ") + d.label;
    list.appendChild(li);
  });
  document.getElementById("earn-box").style.display = shown >= EARNED.length ? "none" : "";
}
// Shop items the kid owns, rendered in the room at their home position
// (SHOP catalog x/y) plus any Arrange drag delta. Suga is a shop pet: he
// only appears here after he is bought. Tapping an item plays its name
// clip when one exists (myghar_<id>_np.m4a); Suga says a Nepali word.
function renderShopItems() {
  const wrap = document.getElementById("shop-items");
  wrap.innerHTML = "";
  const owned = shopOwned();
  SHOP.filter(item => owned.includes(item.id)).forEach(item => {
    const delta = layout[item.id] || [0, 0];
    const el = document.createElement("img");
    el.src = `assets/images/myghar/${item.img}`;
    el.alt = item.en;
    el.className = "myghar-shop-item" + (arranging ? " arranging" : "");
    el.dataset.id = item.id;
    el.style.left = ((item.x + delta[0]) * 100) + "%";
    el.style.top = ((item.y + delta[1]) * 100) + "%";
    el.style.width = item.w + "%";
    el.addEventListener("click", () => {
      if (arranging) return;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      if (item.audio === "suga") {
        play(SUGA_CLIPS[Math.floor(Math.random() * SUGA_CLIPS.length)]);
      } else if (item.audio) {
        play(`assets/audio/nepal-v1/myghar_${item.audio}_np.m4a`);
      }
    });
    makeDraggable(el, item, document.getElementById("stage"), item.x, item.y);
    wrap.appendChild(el);
  });
}
// Mystery treasures the kid has earned from a Mystery Box, rendered in
// the room at their home spot (MYSTERY catalog x/y) plus any Arrange drag
// delta. Same placement system as shop items and trophies.
function renderMysteryItems() {
  const wrap = document.getElementById("shop-items");
  const owned = mysteryOwned();
  MYSTERY.filter(item => owned.includes(item.id)).forEach(item => {
    const delta = layout[item.id] || [0, 0];
    const el = document.createElement("img");
    el.src = `assets/images/myghar/${item.img}`;
    el.alt = item.en;
    el.className = "myghar-shop-item" + (arranging ? " arranging" : "");
    el.dataset.id = item.id;
    el.style.left = ((item.x + delta[0]) * 100) + "%";
    el.style.top = ((item.y + delta[1]) * 100) + "%";
    el.style.width = item.w + "%";
    el.addEventListener("click", () => {
      if (arranging) return;
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      if (item.audio) play(`assets/audio/nepal-v1/myghar_${item.audio}_np.m4a`);
    });
    makeDraggable(el, item, document.getElementById("stage"), item.x, item.y);
    wrap.appendChild(el);
  });
}
// Mystery Boxes: one earned for every 3 decks completed. Opening a box
// reveals a random treasure the kid does not own yet.
function mysteryBoxesAvailable(state) {
  const earned = Math.floor(state.decksDone / MYSTERY_DECKS_PER_BOX);
  return Math.max(0, earned - mysteryOwned().length);
}
function renderMysteryButton(state) {
  const btn = document.getElementById("mystery-btn");
  const n = mysteryBoxesAvailable(state);
  const remaining = MYSTERY.filter(t => !mysteryOwned().includes(t.id)).length;
  btn.textContent = n > 0 ? `🎁 Mystery Box (${n})` : "🎁 Mystery Box";
  btn.disabled = n === 0 || remaining === 0;
  btn.title = n === 0
    ? `Complete ${MYSTERY_DECKS_PER_BOX} more decks to earn a Mystery Box`
    : remaining === 0 ? "You found all the mystery treasures!" : "Open a Mystery Box!";
}
function openMysteryBox(state) {
  const remaining = MYSTERY.filter(t => !mysteryOwned().includes(t.id));
  if (mysteryBoxesAvailable(state) === 0 || remaining.length === 0) return;
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  const list = mysteryOwned();
  list.push(pick.id);
  mysterySaveOwned(list);
  if (window.GharAuth) GharAuth.api("/accounts/children/" + GharAuth.childId() + "/mystery", "POST", { item_id: pick.id }).catch(() => {});
  renderMysteryItems();
  renderMysteryButton(readState());
  showCelebration(`🎁 ${pick.emoji} ${pick.ne}!`, `You found the ${pick.en}!`);
  if (pick.audio) play(`assets/audio/nepal-v1/myghar_${pick.audio}_np.m4a`);
}
function makeDraggable(el, d, container, homeX, homeY) {
  el.addEventListener("pointerdown", e => {
    if (!arranging) return;
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const base = layout[d.id] || [0, 0];
    if (homeX === undefined) homeX = CELL_X[d.cell];
    if (homeY === undefined) homeY = SHELF_Y[d.shelf];
    const origLeft = homeX + base[0], origTop = homeY + base[1];
    function onMove(ev) {
      const dx = (ev.clientX - startX) / rect.width;
      const dy = (ev.clientY - startY) / rect.height;
      const nx = Math.min(0.95, Math.max(0.05, origLeft + dx));
      const ny = Math.min(0.95, Math.max(0.05, origTop + dy));
      el.style.left = (nx * 100) + "%";
      el.style.top = (ny * 100) + "%";
      el._pending = [nx - homeX, ny - homeY];
    }
    function onUp() {
      if (el._pending) {
        layout[d.id] = el._pending;
        saveLayout();
        delete el._pending;
      }
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}
function renderDog(xp) {
  const stage = dogStageFor(xp);
  const dog = document.getElementById("dog");
  dog.style.width = STAGE_WIDTH[stage] + "%";
  document.getElementById("dog-stage-label").textContent = STAGE_NAMES[stage];
  document.getElementById("xp-label").textContent = xp;
  const prev = parseInt(localStorage.getItem(DOG_STAGE_KEY) || "0", 10);
  if (stage > prev) {
    localStorage.setItem(DOG_STAGE_KEY, String(stage));
    const name = localStorage.getItem(DOG_NAME_KEY) || "Bhunte";
    showCelebration(`🎉 ${name} grew!`, `${name} is now a ${STAGE_NAMES[stage]}!`);
    play(stage === 0 ? "assets/audio/nepal-v1/dog_bark.m4a" : "assets/audio/nepal-v1/dog_bark_big.m4a");
  } else {
    localStorage.setItem(DOG_STAGE_KEY, String(stage));
  }
}
function renderNames() {
  const dogName = localStorage.getItem(DOG_NAME_KEY) || "Bhunte";
  const houseName = localStorage.getItem(HOUSE_NAME_KEY) || "My Ghar";
  document.getElementById("dog-name-label").textContent = dogName;
  document.getElementById("sign-name").textContent = dogName;
  document.getElementById("house-name-label").textContent = houseName;
  document.getElementById("dog-name").value = dogName;
  document.getElementById("house-name").value = houseName;
}
function renderDayNight() {
  const hour = new Date().getHours();
  const isDay = hour >= 6 && hour < 18;
  document.getElementById("night-tint").hidden = isDay;
}
async function renderWeather() {
  const el = document.getElementById("weather");
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=39.96&longitude=-82.99&current=temperature_2m,weather_code&temperature_unit=fahrenheit");
    const j = await r.json();
    const code = j.current.weather_code;
    const temp = Math.round(j.current.temperature_2m);
    const emoji = code === 0 ? "☀️" : code <= 2 ? "⛅" : code === 3 ? "☁️" : (code === 45 || code === 48) ? "🌫️" : (code >= 71 && code <= 75) ? "❄️" : code === 95 ? "⛈️" : "🌧️";
    el.textContent = `${emoji} ${temp}°F`;
  } catch (e) {
    el.textContent = "";
  }
}
const SUGA_CLIPS = ["assets/audio/nepal-v1/myghar_sugaMitho_np.m4a", "assets/audio/nepal-v1/myghar_sugaGreeting_np.m4a"];
document.getElementById("dog").addEventListener("click", () => {
  const xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
  const stage = dogStageFor(xp);
  const dog = document.getElementById("dog");
  dog.classList.remove("bounce");
  void dog.offsetWidth;
  dog.classList.add("bounce");
  play(stage === 0 ? "assets/audio/nepal-v1/dog_bark.m4a" : "assets/audio/nepal-v1/dog_bark_big.m4a");
});
document.getElementById("mystery-btn").addEventListener("click", () => {
  openMysteryBox(readState());
});
document.getElementById("arrange-btn").addEventListener("click", () => {
  arranging = !arranging;
  document.getElementById("arrange-btn").textContent = arranging ? "✅ Done arranging" : "🧱 Arrange";
  const state = readState();
  renderTrophies(state);
  renderShopItems();
  renderMysteryItems();
  renderMysteryButton(state);
});
document.getElementById("dog-name").addEventListener("input", e => {
  localStorage.setItem(DOG_NAME_KEY, e.target.value);
  renderNames();
});
document.getElementById("house-name").addEventListener("input", e => {
  localStorage.setItem(HOUSE_NAME_KEY, e.target.value);
  renderNames();
});
GharAuth.pull().catch(() => {}).then(async () => {
  try {
    const m = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/mystery", "GET");
    if (m && Array.isArray(m.items)) {
      const merged = [...new Set([...mysteryOwned(), ...m.items])];
      mysterySaveOwned(merged);
    }
  } catch (e) { /* guest or offline -- local list stands */ }
  try {
    const sh = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/shop", "GET");
    if (sh && Array.isArray(sh.items)) {
      const mergedShop = [...new Set([...shopOwned(), ...sh.items])];
      shopSaveOwned(mergedShop);
    }
  } catch (e) { /* guest or offline -- local list stands */ }
  // Cache the pack so the deck count (for the Mukut) can be read locally.
  try {
    const r = await fetch("data/nepal-v1.json");
    if (r.ok) {
      const pack = await r.json();
      localStorage.setItem("ghar.pack.cache", JSON.stringify({ decks: pack.decks.map(d => ({ id: d.id, words: d.words.map(w => w.id) })) }));
    }
  } catch (e) { /* deck count stays 0 */ }
  const state = readState();
  renderTrophies(state);
  renderShopItems();
  renderMysteryItems();
  renderMysteryButton(state);
  renderDog(state.xp);
  renderNames();
  renderDayNight();
  renderWeather();
}).catch(() => {
  document.getElementById("hint").textContent = "Couldn't load My Ghar. Check your connection and refresh.";
});
</script>
</body>
</html>
