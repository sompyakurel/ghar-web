name: Deploy to S3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy site to S3
        # The exclude list is a seatbelt (audit fix, 2026-11-13):
        # even if a secret or database file is ever committed by
        # mistake, it must not be published to the website. The root
        # .gitignore is the first line of defence; this is the second.
        run: aws s3 sync . s3://ghar-web-sompyakurel/ --exclude ".git/*" --exclude "infra/*" --exclude ".github/*" --exclude ".gitignore" --exclude ".env*" --exclude "*.db" --exclude "*.sqlite*" --exclude "*.tfstate*" --exclude "*.pem" --exclude "*.key" --exclude ".DS_Store" --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1FI40CT2ZFAV9 --paths "/*"
