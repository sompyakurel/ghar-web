<div class="wrap">

  <div class="shop-head">
    <div>
      <h1>🛍️ Ghar Shop</h1>
      <p class="shop-sub">Spend the XP you earn by learning on things for your room. Nothing here costs real money — only XP.</p>
    </div>
    <div class="shop-balance">⭐ <span id="xp-label">0</span> XP</div>

<script>
// Ghar Shop -- buy room decorations and Suga the parrot with XP.
// Prices are in XP. Buying deducts XP (localStorage ghar.xp.total, pushed
// to the server) and records the item in ghar.shop.owned (pushed to the
// server too). Trophies are NOT sold here -- they are earned by learning.
const player = new Audio();
function play(url) { player.pause(); player.src = url; player.play().catch(() => {}); }
// The wallet balance (spendable XP), not the lifetime total — the shop
// must never let the child spend XP they already spent (the refund bug).
function xp() {
  if (window.GharAuth && GharAuth.spendable) return GharAuth.spendable();
  return Math.max((parseInt(localStorage.getItem("ghar.xp.total") || "0", 10) || 0)
    - (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0), 0);
}
function render() {
  const balance = xp();
  document.getElementById("xp-label").textContent = balance;
  const owned = shopOwned();
  const grid = document.getElementById("shop-grid");
  grid.innerHTML = "";
  const freeLeft = shopFreeLeft();
  SHOP.forEach(item => {
    const isOwned = owned.includes(item.id);
    const isFree = !isOwned && freeLeft > 0;
    const afford = isFree || balance >= item.price;
    const displayName = item.id === "suga" ? sugaName() + " the parrot" : item.en;
    const card = document.createElement("div");
    card.className = "shop-card" + (isOwned ? " owned" : "") + (!isOwned && !afford ? " too-expensive" : "");
    const img = document.createElement("img");
    img.src = `assets/images/myghar/${item.img}`;
    img.alt = displayName;
    img.className = "shop-img";
    const ne = document.createElement("div");
    ne.className = "shop-name-ne";
    ne.textContent = `${item.emoji} ${item.ne}`;
    const en = document.createElement("div");
    en.className = "shop-name-en";
    en.textContent = displayName;
    const price = document.createElement("div");
    price.className = "shop-price";
    price.textContent = isOwned ? "✅ Owned" : isFree ? `🎁 FREE (${freeLeft} of 3 left)` : `⭐ ${item.price} XP`;
    card.appendChild(img);
    card.appendChild(ne);
    card.appendChild(en);
    card.appendChild(price);
    if (!isOwned) {
      const btn = document.createElement("button");
      btn.className = "quiz-next shop-buy";
      btn.textContent = isFree ? "Get it free" : afford ? "Buy" : `Need ${item.price - balance} more XP`;
      btn.disabled = !afford;
      btn.addEventListener("click", async () => {
        const charge = isFree ? 0 : item.price;
        if (xp() < charge) return;
        if (!confirm(isFree ? `Get ${displayName} for FREE? (${freeLeft} of 3 free decorations left)` : `Buy ${displayName} for ${item.price} XP?`)) return;
        btn.disabled = true; // no double-tap while the spend is in flight
        if (isFree) {
          shopUseFree();
          // Sync the used count (max-merged server-side) so another
          // device can't re-grant the freebies.
          if (window.GharAuth && GharAuth.childId()) GharAuth.api("/accounts/children/" + GharAuth.childId() + "/myghar", "POST", { free_used: shopFreeUsed() }).catch(() => {});
        } else if (window.GharAuth && GharAuth.spend) {
          // Spend through the server (POST /spend): the deduction sticks
          // across devices and reloads. A failed spend buys nothing.
          const res = await GharAuth.spend(charge, "shop:" + item.id);
          if (!res.ok) {
            document.getElementById("hint").textContent = res.reason === "not enough"
              ? `Not enough XP to buy ${displayName} — you need ${item.price} XP.`
              : `Couldn't complete the purchase — check your connection and try again.`;
            render();
            return;
          }
        } else {
          // auth.js didn't load — local-only fallback (guest behaviour).
          const spent = (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0) + charge;
          localStorage.setItem("ghar.xp.spent", String(spent));
        }
        if (window.GharAuth && GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
        const list = shopOwned();
        list.push(item.id);
        shopSaveOwned(list);
        if (window.GharAuth) GharAuth.api("/accounts/children/" + GharAuth.childId() + "/shop", "POST", { item_id: item.id }).catch(() => {});
        if (item.audio === "suga") {
          play("assets/audio/nepal-v1/myghar_sugaMitho_np.m4a");
        } else if (item.audio) {
          play(`assets/audio/nepal-v1/myghar_${item.audio}_np.m4a`);
        }
        render();
      });
      card.appendChild(btn);
    } else {
      const link = document.createElement("a");
      link.className = "shop-see";
      link.href = "myghar.html";
      link.textContent = "See it in your room →";
      card.appendChild(link);
    }
    grid.appendChild(card);
  });
  document.getElementById("hint").textContent = freeLeft > 0
    ? `🎁 Your first 3 decorations are FREE — ${freeLeft} of 3 left! Tap an item to get it free. Bought things appear in your room.`
    : "Tap an item to buy it. Bought things appear in your room — drag them around in Arrange mode.";
  const ownedBox = document.getElementById("shop-owned");
  ownedBox.textContent = owned.length === 0
    ? "You haven't bought anything yet. Earn XP from lessons, quizzes and missions, then come back!"
    : `You own ${owned.length} of ${SHOP.length} shop items.`;
}
GharAuth.pull().catch(() => {}).then(async () => {
  // Pull the server's owned list so a purchase on another device shows up.
  try {
    const me = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/shop", "GET");
    if (me && Array.isArray(me.items)) {
      const local = shopOwned();
      const merged = [...new Set([...local, ...me.items])];
      shopSaveOwned(merged);
      // First-sync push-back: items bought while offline live only in
      // this browser — record them server-side so another device sees
      // them (and can't charge for them again).
      const serverSet = new Set(me.items);
      merged.filter(id => !serverSet.has(id)).forEach(id => {
        GharAuth.api("/accounts/children/" + GharAuth.childId() + "/shop", "POST", { item_id: id }).catch(() => {});
      });
    }
  } catch (e) { /* guest or offline -- local list stands */ }
  // Pull the server's free-decoration count so a freebie used on another
  // device isn't re-granted here (max-merge both ways).
  try {
    const mg = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/myghar", "GET");
    if (mg && typeof mg.free_used === "number" && mg.free_used > shopFreeUsed()) {
      localStorage.setItem(SHOP_FREE_USED_KEY, String(mg.free_used));
    }
    // First-sync push-back: freebies used before the sync existed live
    // only in this browser.
    if (shopFreeUsed() > (mg.free_used || 0)) {
      GharAuth.api("/accounts/children/" + GharAuth.childId() + "/myghar", "POST", { free_used: shopFreeUsed() }).catch(() => {});
    }
  } catch (e) { /* guest or offline -- local count stands */ }
  render();
}).catch(() => { render(); });
</script>
