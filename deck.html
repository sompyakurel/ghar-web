<script>
const FREE = new Set(["alphabet", "numbers"]);
const BRIGHT = {
  color_rato: "#FF2D2D", color_nilo: "#0091FF", color_hariyo: "#00C853",
  color_pahenlo: "#FFEA00", color_kalo: "#212121", color_seto: "#FFFFFF",
  color_suntala: "#FF6D00", color_pyaji: "#AA00FF", color_khairo: "#8D6E63",
  color_gulabi: "#FF4081",
};
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  if (q.has("test")) localStorage.setItem("ghar.testUnlock", q.get("test") === "off" ? "" : "1");
  return localStorage.getItem("ghar.testUnlock") === "1";
}
const TEST = isTestUnlock();
const deckId = new URLSearchParams(location.search).get("deck");
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
const player = new Audio();
function play(url) {
  player.pause();
  player.src = url;
  player.play().catch(() => {});
}
let playToken = 0;
let mouthTimer = null;
function portrait(speaker, frame) {
  return `assets/images/portraits/${speaker === "A" ? "boy" : "girl"}-${frame}.jpg`;
}
function pinStage() {
  const st = document.querySelector(".stage");
  if (st) st.classList.add("playing");
}
function unpinStage() {
  const st = document.querySelector(".stage");
  if (st) st.classList.remove("playing");
}
function setSpeaker(speaker, word) {
  clearSpeaker();
  if (!speaker) return;
  const actor = document.getElementById("actor-" + speaker);
  const other = document.getElementById("actor-" + (speaker === "A" ? "B" : "A"));
  if (!actor) return;
  actor.classList.add("talking");
  if (other) other.classList.add("listening");
  const img = document.getElementById("img-" + speaker);
  let mouthOpen = false;
  mouthTimer = setInterval(() => {
    mouthOpen = !mouthOpen;
    if (img) img.src = portrait(speaker, mouthOpen ? "talking" : "neutral");
  }, 320);
  const slot = document.getElementById("bubble-slot");
  if (slot && word) {
    slot.innerHTML = `<div class="speak-bubble ${speaker === "A" ? "a" : "b"}"><div class="deva">${esc(word.devanagari)}</div><div class="roma">${esc(word.romanized)}</div></div>`;
  }
}
function clearSpeaker() {
  if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
  ["A", "B"].forEach(s => {
    const actor = document.getElementById("actor-" + s);
    if (actor) actor.classList.remove("talking", "listening");
    const img = document.getElementById("img-" + s);
    if (img) img.src = portrait(s, "neutral");
  });
  const slot = document.getElementById("bubble-slot");
  if (slot) slot.innerHTML = "";
}
function stopSequence() {
  playToken++;
  clearSpeaker();
  unpinStage();
  document.querySelectorAll(".word.playing").forEach(c => c.classList.remove("playing"));
  document.querySelectorAll(".play-btn").forEach(b => { b.textContent = "▶️ Play the conversation"; });
}
function playClip(url) {
  return new Promise(resolve => {
    player.pause();
    player.src = url;
    let done = false;
    const finish = () => { if (done) return; done = true; cleanup(); resolve(); };
    const cleanup = () => {
      player.removeEventListener("ended", finish);
      player.removeEventListener("error", finish);
      clearTimeout(fallback);
    };
    const fallback = setTimeout(finish, 6000);
    player.addEventListener("ended", finish);
    player.addEventListener("error", finish);
    player.play().catch(finish);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function playSection(words, cards, btn, onWord) {
  const token = ++playToken;
  pinStage();
  document.querySelectorAll(".play-btn").forEach(b => { if (b !== btn) b.textContent = "▶️ Play the conversation"; });
  btn.textContent = "⏹ Stop";
  for (let i = 0; i < words.length; i++) {
    if (token !== playToken) break;
    cards.forEach(c => c.classList.remove("playing"));
    cards[i].classList.add("playing");
    cards[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
    if (onWord) onWord(i);
    if (words[i].has_audio && words[i].audio_url) {
      setSpeaker(words[i].speaker || "A", words[i]);
      await playClip(asset(words[i].audio_url));
      clearSpeaker();
    }
    if (token !== playToken) break;
    await wait(450);
  }
  cards.forEach(c => c.classList.remove("playing"));
  clearSpeaker();
  unpinStage();
  btn.textContent = "▶️ Play the conversation";
}
const REWARDED_KEY = "ghar.decks.rewarded";
const COMPLETION_BONUS = 25;
let deckAudioCtx = null;
function playDing() {
  try {
    if (!deckAudioCtx) deckAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (deckAudioCtx.state === "suspended") deckAudioCtx.resume();
    const now = deckAudioCtx.currentTime;
    [[880, 0.25], [1318, 0.12]].forEach(([freq, vol]) => {
      const osc = deckAudioCtx.createOscillator();
      const g = deckAudioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(g).connect(deckAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.9);
    });
  } catch (e) {}
}
function spawnConfetti() {
  const box = document.getElementById("confetti");
  box.innerHTML = "";
  const colors = ["#ff5252", "#ffb300", "#00c853", "#0091ff", "#aa00ff", "#ff4081"];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.4) + "s";
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + "s";
    box.appendChild(piece);
  }
}
const bhuntePlayer = new Audio();
// "Next up" guidance, clicked-through edition: finishing a deck and
// clicking "Next lesson" stores the next deck's id in ghar.speakGuide
// (see evaluateCompletion); on arrival at that deck we say its guide
// line ("...now let's move to ...!") once. A stale flag for a
// different deck is dropped, not saved for later. Attempted twice:
// immediately (fast when the browser allows it - waiting for the
// full render made it feel delayed, Som 2026-11-12) and again after
// the deck renders (the reliable point, same as the home page). If
// the browser still blocks it, the first tap anywhere plays it.
let arrivalGuideArmed = false;
let arrivalGuidePlaying = false;
function tryArrivalGuide() {
  try {
    if (!arrivalGuideArmed) {
      const speakId = localStorage.getItem("ghar.speakGuide");
      if (!speakId) return;
      localStorage.removeItem("ghar.speakGuide");
      if (speakId !== deckId) return;
      bhuntePlayer.src = "assets/audio/bhunte/guide_next_" + deckId + ".m4a";
      arrivalGuideArmed = true;
    }
    if (arrivalGuidePlaying) return;
    bhuntePlayer.play().then(() => { arrivalGuidePlaying = true; }).catch(() => {
      document.addEventListener("pointerdown", () => bhuntePlayer.play().catch(() => {}), { once: true });
    });
  } catch (e) {}
}
tryArrivalGuide();
// Heard-count for any deck (safe read), used to find the next lesson.
function heardCountFor(id) {
  try {
    const arr = JSON.parse(localStorage.getItem("ghar.heard." + id) || "[]");
    return Array.isArray(arr) ? arr.length : 0;
  } catch (e) { return 0; }
}
function showCelebration(title, allDone, isTeen, nextId) {
  const ov = document.getElementById("celebration");
  document.getElementById("celebration-sub").textContent = `${title} · +${COMPLETION_BONUS} XP`;
  ov.hidden = false;
  spawnConfetti();
  playDing();
  // Deck-page completion voice: ONLY the completion line ("You've
  // completed this lesson! Keep going! Your certificate is waiting
  // for you!"), or the certificate line when that was the last deck.
  // The "next up" guidance is NOT said here (Som, 2026-11-12): it
  // plays on the home page when they go back, or on arrival at the
  // next deck when they click "Next lesson" (ghar.speakGuide below).
  if (!isTeen) {
    bhuntePlayer.pause();
    bhuntePlayer.src = allDone ? "assets/audio/bhunte/guide_next_certificate.m4a" : "assets/audio/bhunte/deck_complete.m4a";
    setTimeout(() => bhuntePlayer.play().catch(() => {}), 600);
  }
  // The celebration STAYS until it is tapped or a button is chosen.
  // It used to vanish after 3s - fine when completion was a deliberate
  // final tap, unusable now that hearing the last word completes the
  // deck mid-activity: the Next lesson button disappeared before
  // anyone could read it (Som, 2026-11-12).
}
document.getElementById("celebration").addEventListener("click", () => {
  document.getElementById("celebration").hidden = true;
});
const storeKey = `ghar.heard.${deckId}`;
function loadHeard() {
  // Guarded like index.html: a corrupt or non-array saved value must not
  // kill the page — fall back to an empty set.
  try {
    const v = JSON.parse(localStorage.getItem(storeKey) || "[]");
    return new Set(Array.isArray(v) ? v : []);
  } catch (e) { return new Set(); }
}
let heard = loadHeard();
function saveHeard() { localStorage.setItem(storeKey, JSON.stringify([...heard])); }
// Cross-device deck-rewards sync: the server remembers which decks already
// paid the +25 completion bonus, so a finished deck re-opened on another
// device can't pay it again. Merge only — never wipe local. Pulled in the
// init chain below, before the pack loads, so the merged set is what
// evaluateCompletion() consults.
async function pullDeckRewards() {
  try {
    if (!window.GharAuth || !GharAuth.signedIn || !GharAuth.signedIn() || !GharAuth.childId || !GharAuth.childId()) return;
    const r = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/deck-rewards", "GET");
    if (!r || !Array.isArray(r.rewarded)) return;
    let rewarded;
    try { rewarded = new Set(JSON.parse(localStorage.getItem(REWARDED_KEY) || "[]")); }
    catch (e) { rewarded = new Set(); }
    let changed = false;
    const serverRewarded = new Set(r.rewarded);
    r.rewarded.forEach(id => { if (!rewarded.has(id)) { rewarded.add(id); changed = true; } });
    if (changed) localStorage.setItem(REWARDED_KEY, JSON.stringify([...rewarded]));
    // First-sync upload: decks completed in this browser before the sync
    // existed live only in localStorage — post them so the server (and the
    // dashboard) sees them. The POST is idempotent server-side.
    rewarded.forEach(id => { if (!serverRewarded.has(id)) pushDeckReward(id); });
  } catch (e) {}
}
function pushDeckReward(id) {
  try {
    if (!window.GharAuth || !GharAuth.signedIn || !GharAuth.signedIn() || !GharAuth.childId || !GharAuth.childId()) return;
    GharAuth.api("/accounts/children/" + GharAuth.childId() + "/deck-rewards", "POST", { deck_id: id }).catch(() => {});
  } catch (e) {}
}
GharAuth.pull().catch(() => {}).then(() => GharAuth.refreshUnlock().catch(() => false)).then(() => pullDeckRewards()).then(() => fetch("data/nepal-v1.json?v=4"))
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(pack => {
    const deck = pack.decks.find(d => d.id === deckId);
    if (!deck) throw new Error("no deck");
    heard = loadHeard();
    const isConvo = deck.kind === "convo";
    document.title = `Ghar — ${deck.title}`;
    const content = document.getElementById("content");
    // Server unlock (Stripe $7.99) opens Premium decks, same as TEST.
    if (!FREE.has(deck.id) && !TEST && !GharAuth.isUnlocked()) {
      content.innerHTML = `<div class="deck-head"><h1>🔒 ${esc(deck.title)}</h1><p>This deck unlocks with Ghar Premium.</p><p><button type="button" class="quiz-next" id="unlock-deck-btn">🔓 Unlock — $7.99</button></p><p class="section-sub">One-time payment for the whole family. Already paid? <a href="signin.html">Sign in</a> to restore it.</p></div>`;
      document.getElementById("unlock-deck-btn").addEventListener("click", () => {
        if (!GharAuth.signedIn()) { location.href = "signin.html"; return; }
        GharAuth.startCheckout().catch(() => { content.insertAdjacentHTML("beforeend", `<p class="error">Could not start checkout — check your connection and try again.</p>`); });
      });
      return;
    }
    const total = deck.words.length;
    const stage = isConvo ? `
      <div class="stage">
        <div class="bubble-slot" id="bubble-slot"></div>
        <div class="actors">
          <div class="actor boy" id="actor-A">
            <div class="waves"><span></span><span></span><span></span></div>
            <img id="img-A" src="assets/images/portraits/boy-neutral.jpg" alt="A">
            <div class="actor-label a">A</div>
          </div>
          <div class="stage-mid">💬</div>
          <div class="actor girl" id="actor-B">
            <div class="waves"><span></span><span></span><span></span></div>
            <img id="img-B" src="assets/images/portraits/girl-neutral.jpg" alt="B">
            <div class="actor-label b">B</div>
          </div>
        </div>
      </div>` : "";
    content.innerHTML = `
      <div class="deck-head"><h1>${esc(deck.title)}</h1><p>${total} words · tap a card to hear it — a word counts once it plays ✓</p></div>
      ${stage}
      <div class="progress"><div id="bar"></div></div>
      <p class="progress-label" id="prog-label"></p>
      <div id="sections"></div>
      <div class="complete" id="complete" hidden>🎉 Deck complete — you heard every word!</div>`;
    const sectionsEl = document.getElementById("sections");
    const groups = [];
    deck.words.forEach(w => {
      const s = w.section || "";
      let g = groups.find(g => g.name === s);
      if (!g) { g = { name: s, words: [] }; groups.push(g); }
      g.words.push(w);
    });
    // Hearing a word IS marking it heard - same as the app (Som,
    // 2026-11-12). The check badge is only the indicator now; there is
    // no manual toggle (heard is monotonic - the server merge unions
    // heard sets anyway, so un-hearing never truly propagated).
    function markHeard(w, card) {
      if (heard.has(w.id)) return;
      heard.add(w.id);
      card.classList.add("heard");
      saveHeard();
      GharAuth.push(deckId).catch(() => {});
      updateProgress();
    }
    groups.forEach(g => {
      const head = document.createElement("div");
      head.className = "section-head";
      if (g.name) {
        const h = document.createElement("h2");
        h.className = "section";
        h.textContent = g.name;
        head.appendChild(h);
      }
      const grid = document.createElement("div");
      grid.className = "words";
      const cards = [];
      g.words.forEach(w => {
        const card = document.createElement("div");
        card.className = "word" + (heard.has(w.id) ? " heard" : "");
        const media = w.color_hex
          ? `<div class="swatch" style="background:${esc(BRIGHT[w.id] || w.color_hex)}"></div>`
          : (w.image ? `<img src="${esc(asset(w.image))}" alt="" onerror="this.style.display='none'">` : "");
        card.innerHTML = `
          ${media}
          <span class="heard" aria-hidden="true">✓</span>
          <div class="word-body">
            <div class="deva">${esc(w.devanagari)}</div>
            <div class="roma">${esc(w.romanized)}</div>
            <div class="eng">${esc(w.english)}</div>
          </div>`;
        card.addEventListener("click", e => {
          stopSequence();
          if (w.has_audio && w.audio_url) {
            if (isConvo) {
              pinStage();
              setSpeaker(w.speaker || "A", w);
              player.addEventListener("ended", () => { clearSpeaker(); unpinStage(); }, { once: true });
            }
            play(asset(w.audio_url));
            markHeard(w, card);
          }
        });
        cards.push(card);
        grid.appendChild(card);
      });
      if (deck.kind === "convo" && g.words.length > 1) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "play-btn";
        btn.textContent = "▶️ Play the conversation";
        btn.addEventListener("click", () => {
          if (btn.textContent.startsWith("⏹")) stopSequence();
          else playSection(g.words, cards, btn, i => markHeard(g.words[i], cards[i]));
        });
        head.appendChild(btn);
      }
      if (head.children.length) sectionsEl.appendChild(head);
      sectionsEl.appendChild(grid);
    });
    function evaluateCompletion() {
      if (!(total > 0 && heard.size === total)) return;
      // Mark the lesson just completed EVERY time it is finished (first time
      // or re-do), so the home-page guidance (Jessica) fires on re-dos too —
      // not only the first time the +25 XP is awarded. Store the deck id as
      // well as the title so the home page matches it exactly.
      localStorage.setItem("ghar.justCompleted", deck.title);
      localStorage.setItem("ghar.justCompletedId", deckId);
      let rewarded;
      try { rewarded = new Set(JSON.parse(localStorage.getItem(REWARDED_KEY) || "[]")); }
      catch (e) { rewarded = new Set(); }
      if (rewarded.has(deckId)) return;
      rewarded.add(deckId);
      localStorage.setItem(REWARDED_KEY, JSON.stringify([...rewarded]));
      pushDeckReward(deckId);
      const xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10) + COMPLETION_BONUS;
      localStorage.setItem("ghar.xp.total", String(xp));
      if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(COMPLETION_BONUS);
      GharAuth.push(deckId).catch(() => {});
      if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
      // Next lesson for the celebration's "Next lesson" button (and the home
      // page scroll): first still-to-do deck after this one, else first
      // unfinished overall, else the certificate.
      const curIdx = pack.decks.findIndex(d => d.id === deckId);
      let nextId = null;
      for (let i = curIdx + 1; i < pack.decks.length; i++) {
        if (heardCountFor(pack.decks[i].id) < pack.decks[i].words.length) { nextId = pack.decks[i].id; break; }
      }
      if (!nextId) {
        const firstIncomplete = pack.decks.find(d => heardCountFor(d.id) < d.words.length);
        nextId = firstIncomplete ? firstIncomplete.id : null;
      }
      const nextBtn = document.getElementById("celebration-next");
      if (nextBtn) {
        if (nextId) {
          nextBtn.href = "deck.html?deck=" + nextId;
          nextBtn.textContent = "Next lesson →";
          // Clicking through earns the "next up" guidance on arrival.
          nextBtn.onclick = () => { try { localStorage.setItem("ghar.speakGuide", nextId); } catch (e) {} };
        } else {
          nextBtn.href = "certificate.html";
          nextBtn.textContent = "See your certificate →";
          nextBtn.onclick = null;
        }
      }
      showCelebration(deck.title, rewarded.size === pack.decks.length, deck.difficulty === "teen", nextId);
    }
    function updateProgress() {
      const n = heard.size;
      document.getElementById("bar").style.width = (total ? (n / total * 100) : 0) + "%";
      document.getElementById("prog-label").textContent = `${n} of ${total} heard`;
      const done = total > 0 && n === total;
      document.getElementById("complete").hidden = !done;
      if (done) evaluateCompletion();
    }
    updateProgress();
    tryArrivalGuide();
  })
  .catch(() => { document.getElementById("error").hidden = false; });
</script>
