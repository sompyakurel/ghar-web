<script>
// Rhymes keeps its own copy of the esc() helper (defined below) so it
// works even if auth.js fails to load; auth.js also provides GharAuth
// for the server unlock flag (Stripe $7.99).
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  if (q.has("test")) localStorage.setItem("ghar.testUnlock", q.get("test") === "off" ? "" : "1");
  return localStorage.getItem("ghar.testUnlock") === "1";
}
const TEST = isTestUnlock();
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
const player = new Audio();
let currentBtn = null;
function playSong(audioUrl, btn) {
  if (currentBtn === btn) {
    player.pause();
    btn.textContent = "▶️ Play";
    currentBtn = null;
    return;
  }
  if (currentBtn) currentBtn.textContent = "▶️ Play";
  player.pause();
  player.src = audioUrl;
  btn.textContent = "⏸ Playing…";
  currentBtn = btn;
  player.play().catch(() => { btn.textContent = "▶️ Play"; currentBtn = null; });
  player.onended = () => { btn.textContent = "▶️ Play"; currentBtn = null; };
}
// Server unlock (Stripe $7.99) opens Premium rhymes, same as TEST.
// refreshUnlock() re-reads the flag from GET /accounts/me first.
// Guarded so the page still works if auth.js fails to load.
const _refreshUnlock = (window.GharAuth && GharAuth.refreshUnlock) ? GharAuth.refreshUnlock().catch(() => false) : Promise.resolve(false);
function _isUnlocked() { return !!(window.GharAuth && GharAuth.isUnlocked && GharAuth.isUnlocked()); }
_refreshUnlock.then(() => fetch("data/rhymes-v1.json"))
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(pack => {
    const content = document.getElementById("content");
    if (!TEST && !_isUnlocked()) {
      content.innerHTML = `<div class="deck-head"><h1>🔒 Rhymes</h1><p>These rhymes unlock with Ghar Premium.</p></div>`;
      return;
    }
    document.title = "Ghar — Rhymes";
    const list = document.createElement("div");
    list.className = "song-list";
    pack.songs.forEach(rhyme => {
      const card = document.createElement("div");
      card.className = "song-card";
      const audioUrl = "assets/audio/rhymes/" + rhyme.audio;
      const img = rhyme.image ? `<img class="rhyme-img" src="${esc(asset(rhyme.image))}" alt="" onerror="this.style.display='none'">` : "";
      const lines = rhyme.lyrics_ne.map((ne, i) => `
        <div class="lyric-line"><div class="deva">${esc(ne)}</div><div class="roma">${esc(rhyme.lyrics_en[i] || "")}</div></div>`).join("");
      card.innerHTML = `
        ${img}
        <div class="song-head"><h2>${esc(rhyme.title_ne)}</h2><p>${esc(rhyme.title_en)}</p></div>
        <button type="button" class="play-btn">▶️ Play</button>
        <div class="lyrics">${lines}</div>`;
      card.querySelector(".play-btn").addEventListener("click", e => {
        playSong(audioUrl, e.currentTarget);
      });
      list.appendChild(card);
    });
    content.appendChild(list);
  })
  .catch(() => { document.getElementById("error").hidden = false; });
</script>
