body { background: linear-gradient(180deg, #fff8ee 0%, #f6e8d5 100%); }
.chess-wrap { max-width: 800px; margin: 0 auto; text-align: center; }
.chess-wrap h1 { font-size: 44px; margin: 6px 0 2px; color: #3e2723; letter-spacing: 1px; }
.chess-wrap h1 .knight { display: inline-block; animation: knightBob 2.4s ease-in-out infinite; }
@keyframes knightBob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
.chess-wrap .section-sub { font-size: 17px; }
.chess-modes { display: flex; flex-direction: column; gap: 14px; max-width: 460px; margin: 24px auto; }
.chess-modes button { font-size: 19px; font-weight: 700; padding: 18px; border-radius: 18px; border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.14); transition: transform .15s, box-shadow .15s; }
.chess-modes button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
#mode-2p { background: linear-gradient(135deg, #42a5f5, #1e88e5); color: #fff; }
#mode-cpu-easy { background: linear-gradient(135deg, #66bb6a, #43a047); color: #fff; }
#mode-cpu-med { background: linear-gradient(135deg, #ffa726, #fb8c00); color: #fff; }
#status { display: inline-flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 800; margin: 12px 0 4px; background: #fff; border-radius: 999px; padding: 9px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.12); color: #3e2723; }
#status .chk { color: #c62828; animation: chkPulse 1s infinite; }
@keyframes chkPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.turn-dot { width: 17px; height: 17px; border-radius: 50%; display: inline-block; flex: none; }
.turn-dot.w { background: #fff; border: 2px solid #8d8d8d; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.turn-dot.b { background: #222; border: 2px solid #222; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
#thinking { display: none; font-size: 16px; font-weight: 700; color: #6b5d4f; margin: 6px 0 0; }
#thinking.on { display: block; }
#thinking .tdot { display: inline-block; animation: thinkDot 1.2s infinite; }
#thinking .tdot:nth-child(2) { animation-delay: .2s; }
#thinking .tdot:nth-child(3) { animation-delay: .4s; }
@keyframes thinkDot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }
.board-frame { position: relative; width: min(728px, 94vw); margin: 14px auto 4px; padding: 13px; box-sizing: border-box; background: var(--frame-bg, linear-gradient(135deg, #8d6e63, #5d4037 55%, #3e2723)); border-radius: 20px; box-shadow: 0 16px 38px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.18); border: 3px solid var(--frame-border, #d4a017); }
.board-frame .corner { position: absolute; font-size: 22px; color: var(--frame-border, #d4a017); text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none; z-index: 2; }
.board-frame .corner.tl { top: -2px; left: 6px; transform: rotate(-12deg); }
.board-frame .corner.tr { top: -2px; right: 6px; transform: rotate(12deg); }
.board-frame .corner.bl { bottom: -2px; left: 6px; transform: rotate(12deg); }
.board-frame .corner.br { bottom: -2px; right: 6px; transform: rotate(-12deg); }
#board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--frame-border, #d4a017), 0 0 0 4px rgba(0,0,0,.12); }
#game.pop-in { animation: boardIn .45s ease-out; }
@keyframes boardIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.sq.light { background: var(--sq-light, #f0d9b5); background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%); }
.sq.dark { background: var(--sq-dark, #b58863); background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); }
.sq img { width: 88%; height: 88%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.sq img.land { animation: landPop .22s ease-out; }
@keyframes landPop { 0% { transform: scale(1.32); } 100% { transform: scale(1); } }
.sq.sel { box-shadow: inset 0 0 0 4px #ff9800; }
.sq.dest::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(0,0,0,.28); pointer-events: none; }
.sq.dest-cap::after { content: ""; position: absolute; inset: 5%; border: 4px solid rgba(229,57,53,.75); border-radius: 50%; pointer-events: none; }
.sq.lastmove { box-shadow: inset 0 0 0 100px rgba(255,235,59,.38); }
.sq.incheck { animation: checkPulse 1s infinite; }
@keyframes checkPulse { 0%, 100% { box-shadow: inset 0 0 0 100px rgba(229,57,53,.55); } 50% { box-shadow: inset 0 0 0 100px rgba(229,57,53,.25); } }
.sq .coord { position: absolute; font-size: 12px; font-weight: 700; color: rgba(0,0,0,.45); pointer-events: none; }
.sq .coord.file { right: 4px; bottom: 2px; }
.sq .coord.rank { left: 4px; top: 2px; }
.cap-row { min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 17px; font-weight: 700; color: #6b5d4f; }
.cap-row img { width: 34px; height: 34px; }
#history { max-width: 700px; margin: 12px auto; background: #fff; border-radius: 14px; padding: 12px 16px; box-shadow: 0 1px 6px rgba(0,0,0,.1); font-size: 16px; text-align: left; max-height: 150px; overflow-y: auto; line-height: 1.8; }
#history:empty::before { content: "No moves yet — White starts."; color: #999; }
.chess-toggles { display: flex; gap: 10px; justify-content: center; margin: 10px 0 2px; flex-wrap: wrap; }
.chess-toggles button { font-size: 15px; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: none; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); cursor: pointer; }
.chess-toggles button:hover { background: #f5f5f5; }
.chess-toggles button.off { opacity: .55; }
.chess-btns { display: flex; gap: 10px; justify-content: center; margin: 14px 0 24px; flex-wrap: wrap; }
.chess-btns button { font-size: 17px; font-weight: 700; padding: 12px 20px; border-radius: 14px; border: none; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.chess-btns button:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.16); background: #fff8ee; }
#promo { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
#promo[hidden] { display: none; }
.promo-box { background: #fff; border-radius: 18px; padding: 22px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
.promo-box p { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.promo-box .promo-row { display: flex; gap: 10px; justify-content: center; }
.promo-box button { font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 2px solid #e0d6c8; background: #fff8ee; cursor: pointer; }
.promo-box button img { width: 44px; height: 44px; display: block; margin: 0 auto 4px; }
.chess-themes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0 2px; }
.chess-theme { display: flex; align-items: center; gap: 5px; border: 3px solid transparent; border-radius: 999px; background: #fff; padding: 5px 12px 5px 6px; cursor: pointer; font-size: 14px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.chess-theme.active { border-color: #fb8c00; background: #fff3e0; }
.chess-theme-dot { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; border: 2px solid rgba(0,0,0,.25); line-height: 1; }
#result { font-size: 22px; font-weight: 800; margin: 8px 0; color: #3e2723; }
#result:empty { display: none; }
</style>

  // and frame change with the theme too.
  var CHESS_THEMES = {
    classic:  { name: 'Classic',  pieceW: '#ffffff', pieceB: '#1a1a1a', sqLight: '#f0d9b5', sqDark: '#b58863', frameBg: 'linear-gradient(135deg,#8d6e63,#5d4037 55%,#3e2723)', frameBorder: '#d4a017' },

  };
  var CHESS_THEME_KEY = 'ghar.chess.theme';
  var chessTheme = CHESS_THEMES[localStorage.getItem(CHESS_THEME_KEY)] ? localStorage.getItem(CHESS_THEME_KEY) : 'classic';
  function applyChessTheme(name) {
    if (!CHESS_THEMES[name]) return;

    var root = document.documentElement;

  function pieceImg(type, color) {
    // Cburnett set: Chess_<type><l|d>t45.svg  (l = white, d = black).

    var dir = chessTheme === 'classic' ? '' : chessTheme + '/';

  }

  function playNote(freq, when, dur, type, vol, dest) {
    var o = audioCtx.createOscillator();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g);
    g.connect(dest || musicGain);
    if (dest === musicGain && delaySend) g.connect(delaySend);
    o.start(when); o.stop(when + dur + 0.05);
  }

  function scheduleMusic() {
    if (!musicOn || !audioCtx) return;
    var ahead = audioCtx.currentTime + 0.35;
    while (nextStepTime < ahead) {
      var step = musicStep % 16;
      var f = MEL[step];
      if (f) playNote(f, nextStepTime, STEP * 1.8, 'triangle', 0.5, musicGain);
      if (step % 4 === 0) {
        var bf = (step === 0 || step === 8) ? 130.81 : 98.00;
        playNote(bf, nextStepTime, STEP * 3.2, 'sine', 0.4, musicGain);
      }
      nextStepTime += STEP;
      musicStep++;
    }
  }

  function startDrone() {
    if (droneOsc || !audioCtx) return;
    droneOsc = audioCtx.createOscillator(); droneOsc.type = 'sine'; droneOsc.frequency.value = 65.41;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0.0;
    droneGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);
    droneOsc.connect(droneGain); droneGain.connect(musicGain);
    droneOsc.start();
  }

  function stopDrone() {
    if (!droneOsc) return;
    var o = droneOsc, g = droneGain; droneOsc = null; droneGain = null;
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    o.stop(audioCtx.currentTime + 0.5);
  }

  function startMusic() {
    if (!ensureAudio() || !musicOn) return;
    if (musicTimer) return;
    nextStepTime = audioCtx.currentTime + 0.08;
    musicStep = 0;
    musicTimer = setInterval(scheduleMusic, 90);
    startDrone();
  }

  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    stopDrone();
  }

  function sfxMove() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(150, t, 0.09, 'sine', 0.9, sfxGain);
    playNote(240, t, 0.06, 'triangle', 0.35, sfxGain);
  }

  function sfxCapture() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(120, t, 0.12, 'sine', 1.0, sfxGain);
    playNote(180, t + 0.03, 0.1, 'triangle', 0.5, sfxGain);
  }

  function sfxCheck() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(659.25, t, 0.18, 'triangle', 0.5, sfxGain);
    playNote(523.25, t + 0.14, 0.22, 'triangle', 0.5, sfxGain);
  }

  function sfxEnd(win) {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    if (win === true) {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { playNote(f, t + i * 0.13, 0.3, 'triangle', 0.5, sfxGain); });
    } else if (win === false) {
      [392.00, 329.63, 261.63].forEach(function (f, i) { playNote(f, t + i * 0.16, 0.3, 'triangle', 0.45, sfxGain); });
    } else {
      playNote(440, t, 0.25, 'triangle', 0.45, sfxGain);
      playNote(440, t + 0.22, 0.25, 'triangle', 0.45, sfxGain);
    }
  }

  function refreshToggles() {
    var m = document.getElementById('btn-music');
    var s = document.getElementById('btn-sound');
    m.textContent = musicOn ? '🎵 Music: On' : '🎵 Music: Off';
    s.textContent = sfxOn ? '🔊 Sounds: On' : '🔇 Sounds: Off';
    m.classList.toggle('off', !musicOn);
    s.classList.toggle('off', !sfxOn);
  }

  function squares() {
    // Board squares in display order for the current orientation.
    var list = [];
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var rank = orientation === 'w' ? 8 - r : r + 1;
      var file = orientation === 'w' ? f : 7 - f;
      list.push(String.fromCharCode(97 + file) + rank);
    }
    return list;
  }

  function kingSquare(color) {
    var b = game.board();
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = b[r][f];
      if (pc && pc.type === 'k' && pc.color === color) return String.fromCharCode(97 + f) + (8 - r);
    }
    return null;
  }

  function render() {
    boardEl.innerHTML = '';
    var b = game.board();
    var at = {};
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = b[r][f];
      if (pc) at[String.fromCharCode(97 + f) + (8 - r)] = pc;
    }
    var destSet = {};
    var destCap = {};
    legalTargets.forEach(function (m) { destSet[m.to] = true; if (m.captured) destCap[m.to] = true; });
    squares().forEach(function (sq) {
      var file = sq.charCodeAt(0) - 97;
      var rank = parseInt(sq[1], 10);
      var div = document.createElement('div');
      div.className = 'sq ' + (((file + rank) % 2 === 0) ? 'light' : 'dark');
      div.dataset.sq = sq;
      var pc = at[sq];
      if (pc) {
        var img = document.createElement('img');
        img.src = pieceImg(pc.type, pc.color);
        img.alt = (pc.color === 'w' ? 'White ' : 'Black ') + pc.type;
        if (animateLand && lastMove && lastMove.to === sq) img.className = 'land';
        div.appendChild(img);
      }
      if (selected === sq) div.classList.add('sel');
      if (destSet[sq]) div.classList.add(destCap[sq] ? 'dest-cap' : 'dest');
      if (lastMove && (lastMove.from === sq || lastMove.to === sq)) div.classList.add('lastmove');
      if (game.in_check() && kingSquare(game.turn()) === sq) div.classList.add('incheck');
      // Coordinates on the a-file (ranks) and the 1st rank (files).
      var showRank = (orientation === 'w' ? file === 0 : file === 7);
      var showFile = (orientation === 'w' ? rank === 1 : rank === 8);
      if (showRank) { var cr = document.createElement('span'); cr.className = 'coord rank'; cr.textContent = rank; div.appendChild(cr); }
      if (showFile) { var cf = document.createElement('span'); cf.className = 'coord file'; cf.textContent = sq[0]; div.appendChild(cf); }
      div.addEventListener('click', function () { onSquare(sq); });
      boardEl.appendChild(div);
    });
    animateLand = false;
    updateStatus();
    updateCaptured();
    updateHistory();
  }

  function updateStatus() {
    if (over) return;
    var turn = game.turn() === 'w' ? 'White' : 'Black';
    var dot = '<span class="turn-dot ' + (game.turn() === 'w' ? 'w' : 'b') + '"></span>';
    var s = turn + ' to move';
    if (game.in_check()) s += ' — <span class="chk">Check!</span>';
    if (mode && mode !== '2p') s += (game.turn() === 'w' ? ' (you)' : ' (computer)');
    statusEl.innerHTML = dot + ' ' + s;
  }

  function updateCaptured() {
    var start = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };
    var count = { w: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 } };
    game.board().forEach(function (row) { row.forEach(function (pc) { if (pc) count[pc.color][pc.type]++; }); });
    var capW = [], capB = []; // pieces White lost / Black lost
    ['q', 'r', 'b', 'n', 'p'].forEach(function (t) {
      for (var i = 0; i < start[t] - count.w[t]; i++) capW.push(t);
      for (var j = 0; j < start[t] - count.b[t]; j++) capB.push(t);
    });
    function rowHtml(list, color) {
      if (!list.length) return '';
      return list.map(function (t) { return '<img src="' + pieceImg(t, color) + '" alt="">'; }).join('');
    }
    function matScore() {
      var w = 0, b = 0;
      ['p', 'n', 'b', 'r', 'q'].forEach(function (t) { w += count.w[t] * VAL[t]; b += count.b[t] * VAL[t]; });
      return (w - b) / 100;
    }
    var diff = matScore();
    // Top row = pieces Black has captured (White's lost pieces); bottom = White's captures.
    capTopEl.innerHTML = (orientation === 'w' ? rowHtml(capW, 'w') : rowHtml(capB, 'b')) + (diff < 0 ? ' +' + (-diff) : '');
    capBottomEl.innerHTML = (orientation === 'w' ? rowHtml(capB, 'b') : rowHtml(capW, 'w')) + (diff > 0 ? ' +' + diff : '');
  }

  function updateHistory() {
    var h = game.history();
    if (!h.length) { historyEl.textContent = ''; return; }
    var out = [];
    for (var i = 0; i < h.length; i += 2) {
      out.push((i / 2 + 1) + '. ' + h[i] + (h[i + 1] ? ' ' + h[i + 1] : ''));
    }
    historyEl.textContent = out.join('  ');
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function onSquare(sq) {
    if (over || thinking || pendingPromo) return;
    if (mode && mode !== '2p' && game.turn() === 'b') return; // computer's turn
    // If a square is selected and this is a legal destination, move there.
    if (selected) {
      var mv = null;
      for (var i = 0; i < legalTargets.length; i++) if (legalTargets[i].to === sq) { mv = legalTargets[i]; break; }
      if (mv) {
        if (mv.flags.indexOf('p') >= 0) { pendingPromo = { from: mv.from, to: mv.to }; showPromo(mv.color); return; }
        doMove(mv.from, mv.to, mv.promotion);
        return;
      }
    }
    // Otherwise select (or re-select) a piece of the side to move.
    var piece = game.get(sq);
    if (piece && piece.color === game.turn()) {
      selected = sq;
      legalTargets = game.moves({ square: sq, verbose: true });
      render();
    } else {
      selected = null; legalTargets = []; render();
    }
  }

  function showPromo(color) {
    promoRowEl.innerHTML = '';
    ['q', 'r', 'b', 'n'].forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      var names = { q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight' };
      b.innerHTML = '<img src="' + pieceImg(p, color) + '" alt="">' + names[p];
      b.addEventListener('click', function () {
        var pr = pendingPromo; pendingPromo = null; promoEl.hidden = true;
        doMove(pr.from, pr.to, p);
      });
      promoRowEl.appendChild(b);
    });
    promoEl.hidden = false;
  }

  function doMove(from, to, promotion) {
    var mv = game.move({ from: from, to: to, promotion: promotion });
    if (!mv) return;
    selected = null; legalTargets = [];
    lastMove = { from: mv.from, to: mv.to };
    if (mv.captured) sfxCapture(); else sfxMove();
    animateLand = true;
    render();
    afterMove();
  }

  function afterMove() {
    if (checkEnd()) return;
    if (game.in_check()) setTimeout(sfxCheck, 220);
    if (mode && mode !== '2p' && game.turn() === 'b') {
      thinking = true;
      thinkingEl.classList.add('on');
      updateStatus();
      setTimeout(computerMove, 450);
    }
  }

  function checkEnd() {
    thinkingEl.classList.remove('on');
    if (game.in_checkmate()) {
      over = true;
      var winner = game.turn() === 'w' ? 'Black' : 'White';
      resultEl.textContent = '♔ Checkmate! ' + winner + ' wins!';
      statusEl.textContent = '';
      sfxEnd(mode === '2p' ? true : winner === 'White');
      awardXp(winner === 'White');
      render();
      return true;
    }
    if (game.in_stalemate() || game.in_draw() || game.insufficient_material() || game.in_threefold_repetition()) {
      over = true;
      var why = game.in_stalemate() ? 'Stalemate' : game.insufficient_material() ? 'Insufficient material' : game.in_threefold_repetition() ? 'Threefold repetition' : 'Draw';
      resultEl.textContent = '🤝 ' + why + ' — it\'s a draw!';
      statusEl.textContent = '';
      sfxEnd(null);
      awardXp(null);
      render();
      return true;
    }
    return false;
  }

  // Cross-device sync for the daily paid-game cap. The server is the
  // shared record; local data is never wiped — latest day wins, same day
  // takes the max paid. Guest/offline: no-op, page works.
  function syncChessGames() {
    if (!window.GharAuth || !GharAuth.signedIn() || !GharAuth.childId()) return;
    GharAuth.api('/accounts/children/' + GharAuth.childId() + '/games').then(function (g) {
      var entry = g && g.daily && g.daily.chess;
      var localDay = localStorage.getItem('ghar.chess.day') || '';
      var localPaid = parseInt(localStorage.getItem('ghar.chess.paid') || '0', 10) || 0;
      if (entry && entry.day) {
        if (!localDay || entry.day > localDay) {
          localStorage.setItem('ghar.chess.day', entry.day);
          localStorage.setItem('ghar.chess.paid', String(entry.paid || 0));
        } else if (entry.day === localDay) {
          localStorage.setItem('ghar.chess.paid', String(Math.max(localPaid, entry.paid || 0)));
        }
      }
      // First-sync: if the local state is ahead of the server's (built
      // before the sync existed), push it up so the dashboard and the
      // database browser see it. Re-posting is safe — the server max-merges
      // (latest day wins, same day max).
      var mergedDay = localStorage.getItem('ghar.chess.day') || '';
      var mergedPaid = parseInt(localStorage.getItem('ghar.chess.paid') || '0', 10) || 0;
      var serverDay = (entry && entry.day) || '';
      var serverPaid = (entry && entry.paid) || 0;
      if (mergedDay > serverDay || (mergedDay === serverDay && mergedPaid > serverPaid)) {
        pushChessGames();
      }
    }).catch(function () {});
  }
  function pushChessGames() {
    if (!window.GharAuth || !GharAuth.signedIn() || !GharAuth.childId()) return;
    GharAuth.api('/accounts/children/' + GharAuth.childId() + '/games', 'POST', {
      game: 'chess',
      day: localStorage.getItem('ghar.chess.day') || '',
      paid: parseInt(localStorage.getItem('ghar.chess.paid') || '0', 10) || 0
    }).catch(function () {});
  }

  function awardXp(humanWon) {
    if (!mode || mode === '2p' || xpPaid) return;
    xpPaid = true;
    var today = new Date().toISOString().slice(0, 10);
    var day = localStorage.getItem('ghar.chess.day');
    var paid = parseInt(localStorage.getItem('ghar.chess.paid') || '0', 10);
    if (day !== today) { day = today; paid = 0; }
    if (paid >= 3) { toast('No more XP for chess today — come back tomorrow!'); return; }
    var xp = humanWon === true ? 10 : 2;
    var total = parseInt(localStorage.getItem('ghar.xp.total') || '0', 10) + xp;
    localStorage.setItem('ghar.xp.total', String(total));
    localStorage.setItem('ghar.chess.day', day);
    localStorage.setItem('ghar.chess.paid', String(paid + 1));
    pushChessGames();
    toast(humanWon === true ? '🏆 You win! +' + xp + ' XP' : '🤝 Game over! +' + xp + ' XP', 4000);
    if (window.GharAuth) {
      GharAuth.pushTotals().catch(function () {});
      if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(function () {});
    }
  }

  // ---- Simple computer opponent: minimax + alpha-beta, material + PST ----
  function evaluate() {
    if (game.in_checkmate()) return game.turn() === 'w' ? -100000 : 100000;
    if (game.in_stalemate() || game.in_draw() || game.insufficient_material() || game.in_threefold_repetition()) return 0;
    var score = 0;
    var b = game.board();
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = b[r][f]; if (!pc) continue;
      if (pc.color === 'w') score += VAL[pc.type] + PST[pc.type][r * 8 + f];
      else score -= VAL[pc.type] + PST[pc.type][(7 - r) * 8 + f];
    }
    return score;
  }

  function orderMoves(moves) {
    // Captures first (biggest captured piece first) so alpha-beta prunes well.
    // Only queen promotions for the AI (queen is best in almost every spot).
    var out = [];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      if (m.promotion && m.promotion !== 'q') continue;
      out.push(m);
    }
    out.sort(function (a, b) { return (b.captured ? VAL[b.captured] : 0) - (a.captured ? VAL[a.captured] : 0); });
    return out;
  }

  function minimax(d, alpha, beta, isMax) {
    if (d === 0 || game.in_checkmate() || game.in_draw() || game.in_stalemate() || game.insufficient_material() || game.in_threefold_repetition()) return evaluate();
    var moves = orderMoves(game.moves({ verbose: true }));
    if (isMax) {
      var best = -Infinity;
      for (var i = 0; i < moves.length; i++) {
        game.move(moves[i]);
        var s = minimax(d - 1, alpha, beta, false);
        game.undo();
        if (s > best) best = s;
        if (best > alpha) alpha = best;
        if (alpha >= beta) break;
      }
      return best;
    }
    var bestMin = Infinity;
    for (var j = 0; j < moves.length; j++) {
      game.move(moves[j]);
      var s2 = minimax(d - 1, alpha, beta, true);
      game.undo();
      if (s2 < bestMin) bestMin = s2;
      if (bestMin < beta) beta = bestMin;
      if (alpha >= beta) break;
    }
    return bestMin;
  }

  function bestMove(d) {
    var moves = orderMoves(game.moves({ verbose: true }));
    if (!moves.length) return null;
    var bestScore = Infinity, best = [];
    for (var i = 0; i < moves.length; i++) {
      game.move(moves[i]);
      var s = minimax(d - 1, -Infinity, Infinity, true);
      game.undo();
      if (s < bestScore) { bestScore = s; best = [moves[i]]; }
      else if (s === bestScore) best.push(moves[i]);
    }
    return best[Math.floor(Math.random() * best.length)];
  }

  function computerMove() {
    if (over) { thinking = false; thinkingEl.classList.remove('on'); return; }
    var mv = bestMove(depth);
    thinking = false;
    thinkingEl.classList.remove('on');
    if (!mv) { checkEnd(); return; }
    lastMove = { from: mv.from, to: mv.to };
    game.move(mv);
    if (mv.captured) sfxCapture(); else sfxMove();
    animateLand = true;
    render();
    afterMove();
  }

  function startGame(m, d) {
    mode = m; depth = d;
    game = new Chess();
    orientation = 'w';
    selected = null; legalTargets = []; lastMove = null;
    over = false; thinking = false; xpPaid = false; pendingPromo = null;
    animateLand = false;
    promoEl.hidden = true;
    resultEl.textContent = '';
    thinkingEl.classList.remove('on');
    var g = document.getElementById('game');
    g.classList.remove('pop-in');
    void g.offsetWidth; // restart the entrance animation
    document.getElementById('mode-pick').hidden = true;
    g.hidden = false;
    g.classList.add('pop-in');
    refreshToggles();
    startMusic();
    if (sfxOn && ensureAudio()) {
      var t = audioCtx.currentTime;
      playNote(523.25, t, 0.2, 'triangle', 0.4, sfxGain);
      playNote(783.99, t + 0.12, 0.25, 'triangle', 0.4, sfxGain);
    }
    render();
  }

  document.getElementById('mode-2p').addEventListener('click', function () { startGame('2p', 2); });
  document.getElementById('mode-cpu-easy').addEventListener('click', function () { startGame('cpu-easy', 1); });
  document.getElementById('mode-cpu-med').addEventListener('click', function () { startGame('cpu-med', 2); });
  document.getElementById('btn-new').addEventListener('click', function () { if (mode) startGame(mode, depth); });
  document.getElementById('btn-flip').addEventListener('click', function () {
    orientation = orientation === 'w' ? 'b' : 'w';
    selected = null; legalTargets = [];
    render();
  });
  document.getElementById('btn-mode').addEventListener('click', function () {
    document.getElementById('game').hidden = true;
    document.getElementById('mode-pick').hidden = false;
    mode = null;
  });
  document.getElementById('btn-music').addEventListener('click', function () {
    musicOn = !musicOn;
    localStorage.setItem('ghar.chess.music', musicOn ? '1' : '0');
    if (musicOn) startMusic(); else stopMusic();
    refreshToggles();
  });
  document.getElementById('btn-sound').addEventListener('click', function () {
    sfxOn = !sfxOn;
    localStorage.setItem('ghar.chess.sounds', sfxOn ? '1' : '0');
    refreshToggles();
    if (sfxOn) sfxMove();
  });

  // ---- Theme picker ----
  (function buildChessThemePicker() {
    var picker = document.getElementById('theme-picker');
    if (!picker) return;
    Object.keys(CHESS_THEMES).forEach(function (name) {
      var t = CHESS_THEMES[name];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chess-theme' + (name === chessTheme ? ' active' : '');
      b.dataset.theme = name;
      b.title = t.name + ' theme';
      b.setAttribute('aria-label', t.name + ' piece theme');
      b.innerHTML = '<span class="chess-theme-dot" style="background:' + t.pieceB + ';color:' + t.pieceW + '">♞</span><span class="chess-theme-dot" style="background:' + t.pieceW + ';color:' + t.pieceB + '">♟</span><span>' + t.name + '</span>';
      b.addEventListener('click', function () { applyChessTheme(name); render(); });
      picker.appendChild(b);
    });
  })();
  applyChessTheme(chessTheme);

  if (window.GharAuth) GharAuth.pull().catch(function () {});
  syncChessGames();
})();
</script>
