// ---- XP + quiz stats (same keys/plumbing as quiz.html) ----
let xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
let quizCorrect = parseInt(localStorage.getItem("ghar.quiz.correctTotal") || "0", 10);
let quizStreak = parseInt(localStorage.getItem("ghar.quiz.streak") || "0", 10);
let quizStreakBest = parseInt(localStorage.getItem("ghar.quiz.streakBest") || "0", 10);
function saveXP() { localStorage.setItem("ghar.xp.total", String(xp)); }
// The balance this page shows is the spendable wallet (lifetime minus
// what has been spent), matching the home page, the map and the shop -
// xp above stays the lifetime total that awards keep adding to.
function dispXP() {
  if (window.GharAuth && GharAuth.spendable) return GharAuth.spendable();
  return Math.max(xp - (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0), 0);
}
function saveQuizStats() {
  localStorage.setItem("ghar.quiz.correctTotal", String(quizCorrect));
  localStorage.setItem("ghar.quiz.streak", String(quizStreak));
  localStorage.setItem("ghar.quiz.streakBest", String(quizStreakBest));
}
function awardCorrect(firstTry) {
  const earned = firstTry ? 5 : 2;
  xp += earned; saveXP();
  if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(earned);
  quizCorrect++; quizStreak++;
  if (quizStreak > quizStreakBest) quizStreakBest = quizStreak;
  saveQuizStats();
  if (window.GharAuth && GharAuth.signedIn && GharAuth.signedIn() && GharAuth.childId()) {
    GharAuth.api("/accounts/children/" + GharAuth.childId() + "/quiz-stats", "POST",

  // Places Quiz solves do NOT feed the Quiz Blitz daily challenge
  // (Som, 2026-11-13: the challenge is a fresh Quiz Blitz run).
  if (window.GharAuth) {
    if (GharAuth.pushTotals) GharAuth.pushTotals().catch(() => {});
    if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
  }
  renderXP();
  return earned;
}
function recordWrong() { quizStreak = 0; saveQuizStats(); }

// ---- Sounds (tiny WebAudio synth, like quiz.html's ding) ----
let audioCtx = null;
function getCtx() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  return audioCtx;
}
function tone(freq, delay, dur, vol, type) {
  try {
    const ctx = getCtx(); if (!ctx) return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.35));
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + (dur || 0.35) + 0.05);
  } catch (e) {}
}
function playDing() { tone(880, 0, 0.5, 0.22); tone(1318, 0.08, 0.6, 0.12); }
function playBuzz() { tone(180, 0, 0.25, 0.15, "square"); }

// ---- Helpers ----
const stage = document.getElementById("pq-stage");
const audioEl = document.getElementById("pq-audio");
function playClip(url) { if (!url) return; try { audioEl.src = url; audioEl.play().catch(() => {}); } catch (e) {} }
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function sample(a, n) { return shuffle(a).slice(0, n); }
function renderXP() { document.getElementById("pq-xp").textContent = "⭐ " + dispXP() + " XP"; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function mapSVG() {
  let paths = "";
  PROVINCES.forEach(p => {
    paths += '<path class="province" data-province="' + p.id + '" d="' + PROVINCE_PATHS[p.id] + '" fill="' + p.color + '"/>';
  });
  let labels = "";
  PROVINCES.forEach(p => {
    const xy = PROVINCE_LABELS[p.id];
    labels += '<text x="' + xy[0] + '" y="' + xy[1] + '" font-size="17" text-anchor="middle">' + esc(p.name) + "</text>";
  });
  return '<div class="pq-map"><svg viewBox="0 0 1000 560" role="img" aria-label="Map of Nepal" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="1000" height="560" fill="#dff0e0" rx="16"/>' + paths + labels + "</svg></div>";
}
// ---- Server quiz-stats pull (max-merge, same as quiz.html) ----
async function pullQuizStats() {
  if (!window.GharAuth || !GharAuth.signedIn || !GharAuth.signedIn() || !GharAuth.childId()) return;
  try {
    const s = await GharAuth.api("/accounts/children/" + GharAuth.childId() + "/quiz-stats");
    if (s) {
      if ((s.correct_total || 0) > quizCorrect) quizCorrect = s.correct_total;
      if ((s.streak_best || 0) > quizStreakBest) quizStreakBest = s.streak_best;
      saveQuizStats();
    }
  } catch (e) {}
}

// ---- Unlock state ----
// The split Som signed off with the quiz plan (2026-11-11): Premium and
// test mode get all 27 places; free players get questions on the two
// free places (Kathmandu + Pokhara) plus a taste of the mountains.
let pqUnlocked = (function () {
  try {
    if (new URLSearchParams(location.search).has("test")) localStorage.setItem("ghar.testUnlock", "1");
    if (localStorage.getItem("ghar.testUnlock") === "1") return true;
    if (localStorage.getItem("ghar.unlocked") === "1") return true;
  } catch (e) {}
  if (window.GharAuth && GharAuth.isUnlocked && GharAuth.isUnlocked()) return true;
  return false;
})();
const FREE_PLACE_IDS = { kathmandu: true, pokhara: true };

// ---- Run engine ----
let run = null;
let qState = null;
const BEST_KEY = "ghar.placesquiz.best.v2"; // v2: the score counts clean answers only

function buildRun() {
  if (!pqUnlocked) return buildFreeRun();
  // Paid run: 15 questions — more of the 27 places per run, two mountain
  // rounds, and the province capitals (both directions).
  const places = shuffle(PLACES);
  const used = new Set();
  const take = pl => { used.add(pl.id); return pl; };
  const qs = [];
  places.slice(0, 4).forEach(pl => qs.push({ type: "tap", place: take(pl) }));
  places.slice(4, 6).forEach(pl => qs.push({ type: "listen", place: take(pl) }));
  places.slice(6, 9).forEach(pl => qs.push({ type: "mcq-province", place: take(pl) }));
  sample(PROVINCES, 2).forEach(pv => {
    const inP = PLACES.filter(x => x.province === pv.id);
    const fresh = inP.filter(x => !used.has(x.id));
    const subject = (fresh.length ? fresh : inP)[Math.floor(Math.random() * (fresh.length ? fresh : inP).length)];
    qs.push({ type: "mcq-place", province: pv, place: take(subject) });
  });
  const capProvs = sample(PROVINCES, 2);
  qs.push({ type: "capital", form: "capital-of", province: capProvs[0] });
  qs.push({ type: "capital", form: "province-of", province: capProvs[1] });
  const pair1 = sample(PEAKS, 2), pair2 = sample(PEAKS, 2);
  qs.push({ type: "peaks", a: pair1[0], b: pair1[1] });
  qs.push({ type: "peaks", a: pair2[0], b: pair2[1] });
  return shuffle(qs);
}

function buildFreeRun() {
  // Free = exactly 4 questions (Som, 2026-11-11): one tap and one
  // listening question covering the two free places between them, one
  // multiple-choice, and one mountain question. Everything else is paid.
  const free = shuffle(PLACES.filter(p => FREE_PLACE_IDS[p.id]));
  const qs = [];
  qs.push({ type: "tap", place: free[0] });
  qs.push({ type: "listen", place: free[1] });
  qs.push({ type: "mcq-province", place: free[Math.floor(Math.random() * free.length)] });
  const pair = sample(PEAKS, 2);
  qs.push({ type: "peaks", a: pair[0], b: pair[1] });
  return shuffle(qs);
}

function bestKey() { return pqUnlocked ? "ghar.placesquiz.bestPaid.v2" : BEST_KEY; }
function runLength() { return pqUnlocked ? 15 : 4; }

function startScreen() {
  document.getElementById("pq-progress").textContent = "";
  const best = parseInt(localStorage.getItem(bestKey()) || "-1", 10);
  stage.innerHTML =
    '<div class="pq-card pq-start"><div class="pq-big">🗺️</div>' +
    "<p><b>" + runLength() + " questions</b> about the places on Danfe's map.<br>" +
    "Tap provinces on the map, listen to names in Nepali, pick answers, and race the mountains" +
    (pqUnlocked ? " — plus the province capitals" : "") + ".<br>" +
    "+5 XP for a clean answer · +2 XP after a miss.</p>" +
    (pqUnlocked ? "" : "<p>🆓 Free version: <b>4 questions</b> on Kathmandu &amp; Pokhara, plus a mountain. Premium unlocks the full 15-question run — all 27 places and the capitals.</p>") +
    (best >= 0 ? "<p>🏅 Your best so far: <b>" + best + " / " + runLength() + "</b></p>" : "") +
    '<button class="pq-next" id="pq-start-btn" type="button">▶ Start the quiz</button></div>';
  document.getElementById("pq-start-btn").addEventListener("click", startRun);
}

function startRun() {
  // "correct" counts CLEAN answers only (first try, no misses) - that is
  // what the score and stars mean; solving after a miss still earns XP.
  run = { questions: buildRun(), idx: 0, correct: 0, xpEarned: 0 };
  showQuestion();
}

function showQuestion() {
  const q = run.questions[run.idx];
  qState = { wrongs: 0, solved: false };
  document.getElementById("pq-progress").textContent =
    "Question " + (run.idx + 1) + " of " + run.questions.length + " · ✅ " + run.correct + " so far";
  if (q.type === "tap" || q.type === "listen") renderTap(q);
  else if (q.type === "mcq-province") renderMcqProvince(q);
  else if (q.type === "mcq-place") renderMcqPlace(q);
  else if (q.type === "capital") renderCapital(q);
  else renderPeaks(q);
}

function feedbackHTML() { return '<div class="pq-feedback" id="pq-feedback"></div><div class="pq-fact" id="pq-fact"></div><div id="pq-next-slot"></div>'; }
function setFeedback(text, good) {
  const fb = document.getElementById("pq-feedback");
  fb.textContent = text;
  fb.className = "pq-feedback " + (good ? "good" : "bad");
}
function showFact(text) {
  const f = document.getElementById("pq-fact");
  if (f && text) f.textContent = "💡 " + text;
}
function hintHTML() { return '<div class="pq-hint" id="pq-hint" hidden></div>'; }
function showHint(text) {
  const h = document.getElementById("pq-hint");
  if (h && text) { h.textContent = "💡 " + text; h.hidden = false; qState.hintShown = true; }
}
function showNext() {
  const slot = document.getElementById("pq-next-slot");
  const last = run.idx >= run.questions.length - 1;
  slot.innerHTML = '<button class="pq-next" id="pq-next-btn" type="button">' + (last ? "See my score 🏁" : "Next question →") + "</button>";
  document.getElementById("pq-next-btn").addEventListener("click", () => {
    run.idx++;
    if (run.idx >= run.questions.length) showResults(); else showQuestion();
  });
}
function onCorrect(q, factText) {
  qState.solved = true;
  const earned = awardCorrect(qState.wrongs === 0);
  if (qState.wrongs === 0) run.correct++; // the score counts clean answers only
  run.xpEarned += earned;
  playDing();
  setFeedback("✅ Correct! +" + earned + " XP", true);
  showFact(factText || (q.place ? q.place.fact : ""));
  showNext();
}
function onWrongTap() {
  qState.wrongs++;
  recordWrong();
  playBuzz();
  // First miss: a HINT up by the question — a nudge that helps with
  // the retry but never states the answer (Som, 2026-11-13: several
  // facts named the answer outright). The fact itself is shown after
  // the solve, as the learning moment.
  if (qState.wrongs === 1) showHint(qState.hintText);
}

function renderTap(q) {
  const pl = q.place;
  const isListen = q.type === "listen";
  const prompt = isListen
    ? "🔊 Listen to the name — then tap its province on the map!"
    : '<span class="pq-visual">' + esc(pl.visual || "📍") + "</span>Where is <b>" + esc(pl.name) + "</b>? " +
      '<span class="pq-nep">' + esc(pl.nepali) + "</span><br>Tap its province on the map.";
  stage.innerHTML =
    '<div class="pq-card"><div class="pq-q">' + prompt + "</div>" +
    '<button class="pq-listen" id="pq-listen-btn" type="button">🔊 Hear the name</button>' +
    hintHTML() + mapSVG() + feedbackHTML() + "</div>";
  qState.fact = pl.fact;
  qState.hintText = PROVINCE_HINTS[pl.province];
  const hear = () => playClip(pl.audioName);
  document.getElementById("pq-listen-btn").addEventListener("click", hear);
  hear(); // the name plays by itself as the question arrives (Som, 2026-11-11)
  stage.querySelectorAll(".province").forEach(path => {
    path.addEventListener("click", () => {
      if (qState.solved) return;
      const tapped = path.dataset.province;
      if (tapped === pl.province) {
        path.classList.add("right");
        playClip(pl.audioName);
        onCorrect(q, pl.fact);
      } else {
        onWrongTap();
        path.classList.add("wrong");
        setTimeout(() => path.classList.remove("wrong"), 900);
        setFeedback("✗ That's " + (PROV[tapped] ? PROV[tapped].name : "") + " — try again!", false);
      }
    });
  });
}

function optionButtons(options, renderLabel, onPick) {
  const wrap = document.createElement("div");
  wrap.className = "quiz-options";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "quiz-option";
    b.innerHTML = renderLabel(opt);
    b.addEventListener("click", () => onPick(opt, b));
    wrap.appendChild(b);
  });
  return wrap;
}

function renderMcqProvince(q) {
  const pl = q.place;
  const others = sample(PROVINCES.filter(p => p.id !== pl.province), 3);
  const options = shuffle([PROV[pl.province]].concat(others));
  stage.innerHTML =
    '<div class="pq-card"><div class="pq-q"><span class="pq-visual">' + esc(pl.visual || "📍") + "</span>" +
    "Which province is <b>" + esc(pl.name) + "</b> in?<br>" +
    '<span class="pq-nep">' + esc(pl.nepali) + "</span></div>" +
    '<button class="pq-listen" id="pq-listen-btn" type="button">🔊 Hear the name</button>' +
    hintHTML() + '<div id="pq-options"></div>' + feedbackHTML() + "</div>";
  qState.fact = pl.fact;
  qState.hintText = PROVINCE_HINTS[pl.province];
  document.getElementById("pq-listen-btn").addEventListener("click", () => playClip(pl.audioName));
  playClip(pl.audioName); // auto-play the name as the question arrives
  const wrap = optionButtons(options,
    p => '<span class="opt-eng">' + esc(p.name) + " Province</span>",
    (p, btn) => {
      if (qState.solved) return;
      if (p.id === pl.province) {
        btn.classList.add("correct");
        playClip(pl.audioName);
        onCorrect(q, pl.fact);
      } else {
        onWrongTap();
        btn.classList.add("wrong");
        btn.disabled = true;
        setFeedback("✗ Not " + p.name + " — try again!", false);
      }
    });
  document.getElementById("pq-options").appendChild(wrap);
}

function renderMcqPlace(q) {
  const pv = q.province, pl = q.place;
  const others = sample(PLACES.filter(x => x.province !== pv.id), 3);
  const options = shuffle([pl].concat(others));
  stage.innerHTML =
    '<div class="pq-card"><div class="pq-q">Which of these places is in <b>' + esc(pv.name) + " Province</b>?<br>" +
    '<span class="pq-nep">' + esc(pv.nepali) + "</span></div>" +
    hintHTML() + '<div id="pq-options"></div>' + feedbackHTML() + "</div>";
  qState.fact = pl.fact;
  const outOne = options.find(x => x.id !== pl.id);
  qState.hintText = outOne ? "Psst — " + outOne.name + " is over in " +
    (PROV[outOne.province] ? PROV[outOne.province].name : "") + " Province, so cross that one out." : "";
  const wrap = optionButtons(options,
    x => '<span class="opt-eng">' + esc(x.visual || "📍") + " " + esc(x.name) + '</span><span class="opt-deva">' + esc(x.nepali) + "</span>",
    (x, btn) => {
      if (qState.solved) return;
      if (x.id === pl.id) {
        btn.classList.add("correct");
        playClip(pl.audioName);
        onCorrect(q, pl.fact);
      } else {
        onWrongTap();
        btn.classList.add("wrong");
        btn.disabled = true;
        setFeedback("✗ " + x.name + " is in " + (PROV[x.province] ? PROV[x.province].name : "") + " — try again!", false);
      }
    });
  document.getElementById("pq-options").appendChild(wrap);
}

function renderCapital(q) {
  const pv = q.province;
  const factText = pv.capital + " is the capital of " + pv.name + " Province — " + pv.terrain.toLowerCase() + ".";
  let prompt, options, label, isRight;
  if (q.form === "capital-of") {
    prompt = "🏛️ What is the capital of <b>" + esc(pv.name) + " Province</b>?<br>" +
      '<span class="pq-nep">' + esc(pv.nepali) + "</span>";
    options = shuffle([pv].concat(sample(PROVINCES.filter(p => p.id !== pv.id), 3)));
    label = p => '<span class="opt-eng">' + esc(p.capital) + '</span><span class="opt-deva">' + esc(p.capitalNepali) + "</span>";
    isRight = p => p.id === pv.id;
  } else {
    prompt = "🏛️ <b>" + esc(pv.capital) + "</b> is the capital of which province?<br>" +
      '<span class="pq-nep">' + esc(pv.capitalNepali) + "</span>";
    options = shuffle([pv].concat(sample(PROVINCES.filter(p => p.id !== pv.id), 3)));
    label = p => '<span class="opt-eng">' + esc(p.name) + " Province</span>";
    isRight = p => p.id === pv.id;
  }
  stage.innerHTML =
    '<div class="pq-card"><div class="pq-q">' + prompt + "</div>" +
    hintHTML() + '<div id="pq-options"></div>' + feedbackHTML() + "</div>";
  qState.fact = factText;
  qState.hintText = q.form === "capital-of"
    ? "It starts with the letter “" + pv.capital.charAt(0) + "”."
    : "The province's name starts with the letter “" + pv.name.charAt(0) + "”.";
  const wrap = optionButtons(options, label, (p, btn) => {
    if (qState.solved) return;
    if (isRight(p)) {
      btn.classList.add("correct");
      onCorrect(q, factText);
    } else {
      onWrongTap();
      btn.classList.add("wrong");
      btn.disabled = true;
      setFeedback("✗ Not that one — try again!", false);
    }
  });
  document.getElementById("pq-options").appendChild(wrap);
}

function renderPeaks(q) {
  const taller = q.a.h > q.b.h ? q.a : q.b;
  const shorter = taller === q.a ? q.b : q.a;
  const factText = taller.name + " is " + taller.h.toLocaleString("en-US") + " m tall — " +
    (taller.h - shorter.h).toLocaleString("en-US") + " m taller than " + shorter.name + " (" + shorter.h.toLocaleString("en-US") + " m).";
  stage.innerHTML =
    '<div class="pq-card"><div class="pq-q"><span class="pq-visual">🏔️</span>Which mountain is <b>taller</b>?</div>' +
    hintHTML() + '<div id="pq-options"></div>' + feedbackHTML() + "</div>";
  qState.fact = factText;
  qState.hintText = "One of these two stands under " +
    (Math.ceil((shorter.h + 1) / 100) * 100).toLocaleString("en-US") + " m — the taller one is the answer.";
  const wrap = optionButtons([q.a, q.b],
    p => '<span class="opt-eng">🏔️ ' + esc(p.name) + "</span>" + (p.nepali ? '<span class="opt-deva">' + esc(p.nepali) + "</span>" : ""),
    (p, btn) => {
      if (qState.solved) return;
      if (p === taller) {
        // Reveal both heights only once it is solved — that is the
        // learning moment. Revealing them on a miss gave the retry away.
        wrap.querySelectorAll(".quiz-option").forEach((b, i) => {
          const pk = [q.a, q.b][i];
          if (!b.querySelector(".pq-h")) {
            const s = document.createElement("span");
            s.className = "pq-h";
            s.textContent = pk.h.toLocaleString("en-US") + " m";
            b.appendChild(s);
          }
        });
        btn.classList.add("correct");
        onCorrect(q, factText);
      } else {
        onWrongTap();
        btn.classList.add("wrong");
        btn.disabled = true;
        setFeedback("✗ " + p.name + " is " + p.h.toLocaleString("en-US") + " m — the other one is taller!", false);
      }
    });
  wrap.querySelectorAll(".quiz-option").forEach(b => b.classList.add("pq-peakbtn"));
  document.getElementById("pq-options").appendChild(wrap);
}

function showResults() {
  document.getElementById("pq-progress").textContent = "Run complete!";
  const best = parseInt(localStorage.getItem(bestKey()) || "-1", 10);
  if (run.correct > best) localStorage.setItem(bestKey(), String(run.correct));
  const frac = run.questions.length ? run.correct / run.questions.length : 0;
  const stars = frac >= 0.85 ? 3 : frac >= 0.65 ? 2 : frac >= 0.4 ? 1 : 0;
  const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  const msg = frac >= 0.85 ? "Nepal expert! Danfe is impressed. 🦚" :
    frac >= 0.65 ? "Great exploring!" :
    frac >= 0.4 ? "Good start — the map is waiting for another look!" :
    "Every explorer starts somewhere — try the map, then quiz again!";
  stage.innerHTML =
    '<div class="pq-card pq-score"><div class="pq-stars">' + starStr + "</div>" +
    "<h2>You scored " + run.correct + " / " + run.questions.length + "</h2>" +
    "<p>Score counts answers right on the first try — solving after a miss still earns XP.</p>" +
    "<p>+" + run.xpEarned + " XP this run · ⭐ " + dispXP() + " XP</p>" +
    "<p>" + msg + "</p>" +
    '<button class="pq-next" id="pq-again-btn" type="button">↻ Play again</button>' +
    '<p style="margin-top:12px"><a href="map.html">← Back to the Map</a> · <a href="index.html">Home</a></p></div>';
  document.getElementById("pq-again-btn").addEventListener("click", startRun);
}

renderXP();
startScreen();
pullQuizStats();
if (window.GharAuth && GharAuth.pull) GharAuth.pull().catch(() => {});
</script>
<script>
// Unlock refresh: the cached flag picks the question pool at load; the
// server re-check upgrades this page to the full pool if the account is
// actually unlocked (the start screen re-renders to match, unless a run
// is already going).
(function () {
  if (!window.GharAuth) return;
  if (GharAuth.pull) GharAuth.pull().then(function () {
    xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10) || 0;
    renderXP();
  }).catch(function () {});
  if (GharAuth.refreshUnlock) GharAuth.refreshUnlock().then(function (u) {
    if (u && !pqUnlocked) { pqUnlocked = true; if (!run) startScreen(); }
  }).catch(function () {});
})();
</script>

<script>
// ---- Friend duel: Places Quiz (2026-11-12). Both players get the
// same eight places; the fact is the clue, first tap counts; the
// server compares score, then time.
(function () {
  var duelId = new URLSearchParams(location.search).get("duel");
  if (!duelId || !window.GharFriends) return;
  var GF = window.GharFriends;
  var stage = document.getElementById("pq-stage");
  if (!stage) return;
  var cid = GF.childId();
  // Free-tier friend games (Som's final rule, 2026-11-13): Places
  // Quiz duels are premium at BOTH doors - a free account can
  // neither start one nor play one it was invited to.
  function fgPremiumOpen() {
    return localStorage.getItem("ghar.testUnlock") === "1"
        || (window.GharAuth && GharAuth.isUnlocked && GharAuth.isUnlocked());
  }
  if (cid && !fgPremiumOpen()) {
    stage.innerHTML = '<div class="fg-banner"><h2>🗺️ Places duel</h2><p>🔒 This duel is part of Ghar Premium. On the free tier, friends play Balloon Pop, Memory Match and Quiz Blitz.</p></div>';
    return;
  }
  if (!cid) {
    stage.innerHTML = '<div class="fg-banner"><h2>🗺️ Places duel</h2><p>Sign in — or have a parent sign in — to play this duel.</p></div>';
    return;
  }
  var MD = window.GHAR_MAP_DATA || {};
  var byId = {};
  (MD.pins || []).concat(MD.landmarks || []).forEach(function (pl) { byId[pl.id] = pl; });
  function end(g, myScore, opp) {
    var html = '<div class="fg-banner"><h2>🗺️ Places duel vs ' + GF.esc(opp) + '</h2>';
    if (g.status === "finished") {
      GF.claimRewards(cid);
      html += '<p>' + (g.winner === "me" ? "🏆 You won!" : g.winner === "draw" ? "🤝 It's a draw" : "🏆 " + GF.esc(opp) + " won") + '</p>';
      if (g.my_result) html += '<p>You: ' + g.my_result.score + '/8 · ' + GF.fmtTime(g.my_result.time_ms) + '</p>';
      if (g.opponent_result) html += '<p>' + GF.esc(opp) + ': ' + g.opponent_result.score + '/8 · ' + GF.fmtTime(g.opponent_result.time_ms) + '</p>';
      html += '<button type="button" class="fg-btn" id="duel-rematch">Rematch</button>';
    } else if (g.status === "abandoned") {
      html += '<p>💤 This duel closed — no play for 7 days.</p>';
    } else {
      html += '<p>You scored ' + (myScore != null ? myScore : (g.my_result ? g.my_result.score : "?")) + '/8 — waiting for ' + GF.esc(opp) + ' to play.</p>';
      setTimeout(function () {
        GF.get(cid, duelId).then(function (g3) { if (g3.status !== "active") end(g3, myScore, opp); }).catch(function () {});
      }, 10000);
    }
    html += '<a class="fg-btn fg-btn-ghost" href="leaderboard.html">All friend games</a></div>';
    stage.innerHTML = html;
    var rm = document.getElementById("duel-rematch");
    if (rm) rm.addEventListener("click", function () {
      GF.rematch(cid, duelId).then(function (ng) { location.href = "places-quiz.html?duel=" + ng.id; }).catch(function () {});
    });
  }
  GF.get(cid, duelId).then(function (g) {
    var opp = (g.opponent && g.opponent.nickname) || "Friend";
    if (g.i_played || g.status !== "active") { end(g, null, opp); return; }
    var qs = g.state.payload.questions;
    var idx = 0, correct = 0, startT = performance.now(), locked = false;
    function renderQ() {
      locked = false;
      var q = qs[idx];
      var pl = byId[q.place] || {};
      var html = '<div class="pq-card"><div class="pq-q">' +
        '<span class="pq-visual">' + GF.esc(pl.visual || "📍") + '</span>' +
        'Which place is this?<br><span style="font-weight:400">' + GF.esc(pl.fact || "") + '</span></div>' +
        '<p class="quiz-xp" style="text-align:center">Question ' + (idx + 1) + ' of ' + qs.length + ' · vs ' + GF.esc(opp) + '</p>' +
        '<p class="quiz-feedback" id="duel-fb"></p><div class="quiz-options">';
      q.choices.forEach(function (cid2) {
        var c = byId[cid2] || {};
        html += '<button type="button" class="quiz-option" data-id="' + GF.esc(cid2) + '">' +
          '<div class="opt-deva">' + GF.esc(c.name || cid2) + '</div>' +
          '<div class="opt-sub">' + GF.esc(c.nepali || "") + '</div></button>';
      });
      html += '</div></div>';
      stage.innerHTML = html;
      stage.querySelectorAll(".quiz-option").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (locked) return;
          locked = true;
          var right = btn.dataset.id === q.place;
          if (right) { correct++; btn.classList.add("correct"); }
          else {
            btn.classList.add("wrong");
            stage.querySelectorAll(".quiz-option").forEach(function (b) {
              if (b.dataset.id === q.place) b.classList.add("correct");
            });
          }
          document.getElementById("duel-fb").textContent = right ? "✅ Correct!" : "✗ That was " + ((byId[q.place] || {}).name || "");
          document.getElementById("duel-fb").className = "quiz-feedback " + (right ? "good" : "bad");
          setTimeout(function () {
            idx++;
            if (idx < qs.length) renderQ();
            else GF.result(cid, duelId, correct, Math.round(performance.now() - startT))
              .then(function (g2) { end(g2, correct, opp); })
              .catch(function () { end(g, correct, opp); });
          }, 1100);
        });
      });
    }
    renderQ();
  }).catch(function () {
    stage.innerHTML = '<div class="fg-banner"><h2>🗺️ Places duel</h2><p>Could not load this duel. <a href="leaderboard.html">Back to friend games</a></p></div>';
  });
})();
</script>
