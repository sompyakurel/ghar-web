<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar — Learn Nepali</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 Ghar</h1>
    <p>Learn Nepali, have fun.</p>
  </header>
  <nav class="subnav">
    <a href="songs.html">🎵 Songs <span class="badge locked" id="badge-songs">🔒 Locked</span></a>
    <a href="rhymes.html">🎶 Rhymes <span class="badge locked" id="badge-rhymes">🔒 Locked</span></a>
    <a href="quiz.html">🎮 Quiz</a>
  </nav>
  <p class="testmode" id="testmode" hidden>🧪 Test mode — all decks unlocked. <a href="index.html?test=off">Turn off</a></p>
  <div class="grid" id="decks"></div>
  <p class="error" id="error" hidden>Couldn't load the lessons. Check your connection and refresh.</p>
</div>
<div id="toast"></div>
<script>
const FREE = new Set(["alphabet", "numbers"]);
const TIERS = { beginner: "🌱 Beginner", intermediate: "🌿 Intermediate", hard: "🌳 Hard", teen: "🔥 Teen" };
const BRIGHT = {
  color_rato: "#FF2D2D", color_nilo: "#0091FF", color_hariyo: "#00C853",
  color_pahenlo: "#FFEA00", color_kalo: "#212121", color_seto: "#FFFFFF",
  color_suntala: "#FF6D00", color_pyaji: "#AA00FF", color_khairo: "#8D6E63",
  color_gulabi: "#FF4081",
};
const COVER_OVERRIDES = {
  texting: "assets/images/txt_message.jpg",
  slang: "assets/images/slang_khatra.jpg",
  comebacks: "assets/images/comeback_hasayo.jpg",
  captions: "assets/images/caption_dashain.jpg",
  lyrics: "assets/images/lyric_resham.jpg",
};
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  if (q.has("test")) localStorage.setItem("ghar.testUnlock", q.get("test") === "off" ? "" : "1");
  return localStorage.getItem("ghar.testUnlock") === "1";
}
const TEST = isTestUnlock();
if (TEST) {
  document.getElementById("testmode").hidden = false;
  document.getElementById("badge-songs").textContent = "TEST";
  document.getElementById("badge-songs").className = "badge free";
  document.getElementById("badge-rhymes").textContent = "TEST";
  document.getElementById("badge-rhymes").className = "badge free";
}
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
fetch("data/nepal-v1.json")
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(pack => {
    const grid = document.getElementById("decks");
    pack.decks.forEach(deck => {
      const free = FREE.has(deck.id);
      const open = free || TEST;
      const a = document.createElement("a");
      a.className = "card" + (open ? "" : " locked");
      a.href = open ? `deck.html?deck=${deck.id}` : "#";
      let cover = "";
      if (deck.id === "colors") {
        cover = `<div class="color-strip">${deck.words.map(w => `<span style="background:${BRIGHT[w.id] || w.color_hex || "#ccc"}"></span>`).join("")}</div>`;
      } else {
        const coverUrl = COVER_OVERRIDES[deck.id] || deck.cover_image;
        if (coverUrl) cover = `<img src="${asset(coverUrl)}" alt="${deck.title}" onerror="this.remove()">`;
      }
      a.innerHTML = `
        <div class="cover"><div class="cover-fallback">${deck.title.charAt(0)}</div>${cover}</div>
        <div class="card-body">
          <h2>${deck.title}</h2>
          <p>${deck.words.length} words · ${TIERS[deck.difficulty] || deck.difficulty}</p>
          <span class="badge ${free ? "free" : "locked"}">${free ? "FREE" : (TEST ? "TEST" : "🔒 Locked")}</span>
        </div>`;
      if (!open) a.addEventListener("click", e => { e.preventDefault(); toast("🔒 This deck unlocks with Ghar Premium"); });
      grid.appendChild(a);
    });
  })
  .catch(() => { document.getElementById("error").hidden = false; });
</script>
</body>
</html>
