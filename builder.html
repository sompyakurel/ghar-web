<script>
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  if (q.has("test")) localStorage.setItem("ghar.testUnlock", q.get("test") === "off" ? "" : "1");
  return localStorage.getItem("ghar.testUnlock") === "1";
}
const TEST = isTestUnlock();
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
let xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
function saveXP() { localStorage.setItem("ghar.xp.total", String(xp)); }
// The balance this page shows is the spendable wallet (lifetime minus
// what has been spent), matching the home page, the map and the shop -
// xp above stays the lifetime total that awards keep adding to.
function dispXP() {
  if (window.GharAuth && GharAuth.spendable) return GharAuth.spendable();
  return Math.max(xp - (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0), 0);
}
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playDing() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [[880, 0.25], [1318, 0.12]].forEach(([freq, vol]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(g).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.9);
    });
  } catch (e) {}
}
const WRONG_CLIPS = ["feedback_vayena_1_np.m4a", "feedback_vayena_2_np.m4a"];
const feedbackPlayer = new Audio();
function playWrongFeedback() {
  const file = WRONG_CLIPS[Math.floor(Math.random() * WRONG_CLIPS.length)];
  feedbackPlayer.pause();
  feedbackPlayer.src = "assets/audio/nepal-v1/" + file;
  feedbackPlayer.play().catch(() => {});
}
const player = new Audio();
const ROUNDS = [
  [
    { english: "I eat momos", emoji: "🥟", wordIDs: ["sent_ma", "momo", "khaanchhu"] },
    { english: "I drink tea", emoji: "🍵", wordIDs: ["sent_ma", "chiya", "piunchhu"] },
    { english: "I write a letter", emoji: "✉️", wordIDs: ["sent_ma", "chitthi", "lekhchhu"] },

    { english: "I listen to grandmother", emoji: "👵", wordIDs: ["sent_ma", "hajuraama", "sunchhu"] },

  ],
  [
    { english: "I eat rice", emoji: "🍚", wordIDs: ["sent_ma", "bhat", "khaanchhu"] },
    { english: "I drink water", emoji: "💧", wordIDs: ["sent_ma", "pani", "piunchhu"] },
    { english: "I write my name", emoji: "✏️", wordIDs: ["sent_ma", "naam", "lekhchhu"] },
    { english: "I go home", emoji: "🏠", wordIDs: ["sent_ma", "ghar", "jaanchhu"] },
    { english: "I read a letter", emoji: "✉️", wordIDs: ["sent_ma", "chitthi", "padhchhu"] },
    { english: "I go to class", emoji: "🏫", wordIDs: ["sent_ma", "kaksha", "jaanchhu"] },
    { english: "I read my name", emoji: "🏷️", wordIDs: ["sent_ma", "naam", "padhchhu"] },
    { english: "I play with the dog", emoji: "🐶", wordIDs: ["sent_ma", "kukur", "khelchhu"] },
  ],
  [
    { english: "I eat mangoes", emoji: "🥭", wordIDs: ["sent_ma", "aanp", "khaanchhu"] },
    { english: "I drink milk", emoji: "🥛", wordIDs: ["sent_ma", "doodh", "piunchhu"] },
    { english: "I write in a notebook", emoji: "📓", wordIDs: ["sent_ma", "kapi", "ma_loc", "lekhchhu"] },
    { english: "I go to school", emoji: "🏫", wordIDs: ["sent_ma", "skool", "jaanchhu"] },
    { english: "I read my notebook", emoji: "📓", wordIDs: ["sent_ma", "kapi", "padhchhu"] },
    { english: "I sing the festival songs", emoji: "🎉", wordIDs: ["sent_ma", "tihar_deusi", "gauchhu"] },
    { english: "I write a song", emoji: "🎼", wordIDs: ["sent_ma", "geet", "lekhchhu"] },
    { english: "I listen to mom", emoji: "👩", wordIDs: ["sent_ma", "aama", "sunchhu"] },
  ],
  [
    { english: "I watch the teacher", emoji: "👩‍🏫", wordIDs: ["sent_ma", "shikshak", "herchhu"] },
    { english: "I cook food", emoji: "🍲", wordIDs: ["sent_ma", "khana", "pakauchhu"] },
    { english: "I play with my friend", emoji: "🧑‍🤝‍🧑", wordIDs: ["sent_ma", "saathi", "sanga", "khelchhu"] },
    { english: "I play on the swing", emoji: "🎠", wordIDs: ["sent_ma", "dash_ping", "khelchhu"] },
    { english: "I wash my hands", emoji: "🧼", wordIDs: ["sent_ma", "haat", "dhunchhu"] },
    { english: "I fly the kite", emoji: "🪁", wordIDs: ["sent_ma", "dash_changa", "udauchhu"] },
    { english: "I cook vegetable curry", emoji: "🥘", wordIDs: ["sent_ma", "tarkari", "pakauchhu"] },
    { english: "I watch the lights", emoji: "✨", wordIDs: ["sent_ma", "tihar_jhilimili", "herchhu"] },
  ],
];
let byID = {};
let sessionRounds = [];
let roundIndex = 0;
let sentenceIndex = 0;
let placedIDs = [];
let poolIDs = [];
let attempts = 0;
let solved = false; // true once this sentence is answered correctly — blocks re-pay
let correctCount = 0;
let roundCorrect = 0;
let roundEarnedXP = 0;
let totalEarnedXP = 0;
let phase = "build";
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function round() { return sessionRounds[roundIndex]; }
function sentence() { return round()[sentenceIndex]; }
function startRound() {
  sentenceIndex = 0;
  roundCorrect = 0;
  roundEarnedXP = 0;
  phase = "build";
  dealSentence();
}
// A new session shuffles ALL sentences together and deals them into
// rounds of 8, so every session has different sentences in each round —
// not the same fixed sets in the same order. (startRound only begins
// the current round; it must not re-shuffle mid-session.)
function startSession() {
  const all = shuffle(ROUNDS.flat());
  sessionRounds = [];
  for (let i = 0; i < all.length; i += 8) sessionRounds.push(all.slice(i, i + 8));
  roundIndex = 0;
  correctCount = 0;
  totalEarnedXP = 0;
  startRound();
}
function dealSentence() {
  placedIDs = [];
  attempts = 0;
  solved = false;
  poolIDs = shuffle([...sentence().wordIDs]);
  render();
}
function place(id) {
  placedIDs.push(id);
  poolIDs = poolIDs.filter(x => x !== id);
  // Say the word out loud as soon as it is pressed, so the kid hears
  // each word — not only the full sentence at the end.
  const w = byID[id];
  if (w && w.has_audio && w.audio_url) {
    player.pause();
    player.onended = null;
    player.src = asset(w.audio_url);
    player.play().catch(() => {});
  }
  render();
  if (placedIDs.length === sentence().wordIDs.length) checkAnswer();
}
function unplace(id) {
  if (solved) return; // answer already paid — tiles are locked until next sentence
  placedIDs = placedIDs.filter(x => x !== id);
  poolIDs.push(id);
  render();
}
function playFullSentence() {
  const words = sentence().wordIDs.map(id => byID[id]).filter(Boolean);
  const urls = words.filter(w => w.has_audio && w.audio_url).map(w => asset(w.audio_url));
  if (urls.length !== words.length || !urls.length) return;
  let i = 0;
  const playNext = () => {
    if (i >= urls.length) return;
    player.pause();
    player.src = urls[i];
    player.onended = () => { i++; playNext(); };
    player.play().catch(() => { i++; playNext(); });
  };
  playNext();
}
function checkAnswer() {
  if (solved) return; // already paid for this sentence — no double-pay
  const s = sentence();
  if (JSON.stringify(placedIDs) === JSON.stringify(s.wordIDs)) {
    solved = true; // lock the tiles before paying, so the 1.6s window can't re-pay
    correctCount += 1;
    roundCorrect += 1;
    const earned = attempts === 0 ? 5 : 2;
    xp += earned;
    roundEarnedXP += earned;
    totalEarnedXP += earned;
    saveXP();
    if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(earned);
    GharAuth.pushTotals().catch(() => {});
    if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
    playDing();
    playFullSentence();
    render(); // re-render so the placed tiles show disabled during the window
    setTimeout(() => {
      if (sentenceIndex + 1 < round().length) { sentenceIndex += 1; dealSentence(); }
      else { phase = "roundDone"; render(); }
    }, 1600);
  } else {
    attempts += 1;
    playWrongFeedback();
    const row = document.getElementById("answer-row");
    if (row) {
      row.classList.remove("shake");
      void row.offsetWidth;
      row.classList.add("shake");
    }
    const wrong = [...placedIDs];
    setTimeout(() => {
      placedIDs = [];
      poolIDs = shuffle([...poolIDs, ...wrong]);
      render();
    }, 500);
  }
}
function render() {
  const content = document.getElementById("content");
  if (phase === "roundDone") {
    content.innerHTML = `
      <div class="sent-done">
        <div class="sent-done-emoji">🎉</div>
        <h1>Round ${roundIndex + 1} done!</h1>
        <p>+${roundEarnedXP} XP · ${roundCorrect}/${round().length} correct</p>
        ${roundIndex + 1 < sessionRounds.length
          ? `<button class="quiz-next" id="next-round">Next round →</button>`
          : `<button class="quiz-next" id="finish">Finish</button>`}
      </div>`;
    const nr = document.getElementById("next-round");
    if (nr) nr.addEventListener("click", () => { roundIndex += 1; startRound(); });
    const fin = document.getElementById("finish");
    if (fin) fin.addEventListener("click", () => { phase = "allDone"; render(); });
    return;
  }
  if (phase === "allDone") {
    const total = sessionRounds.flat().length;
    content.innerHTML = `
      <div class="sent-done">
        <div class="sent-done-emoji">🏆</div>
        <h1>Sentence builder!</h1>
        <p>+${totalEarnedXP} XP · ${correctCount}/${total} sentences built</p>
        <p class="sent-done-sub">म ___ ___छु। — you can say what you DO in Nepali now.</p>
        <button class="quiz-next" id="again">Play again</button>
      </div>`;
    document.getElementById("again").addEventListener("click", () => {
      startSession();
    });
    return;
  }
  const s = sentence();
  content.innerHTML = `
    <div class="quiz-player">
      <h1>🧱 Round ${roundIndex + 1}</h1>
      <p class="quiz-xp">⭐ ${dispXP()} XP · ${sentenceIndex + 1} / ${round().length}</p>
      <div class="progress"><div style="width:${(sentenceIndex / round().length * 100)}%"></div></div>
      <div class="builder-prompt">
        <div class="builder-emoji">${s.emoji}</div>
        <div class="builder-english">${esc(s.english)}</div>
        <p class="sent-hint">Tap the words in order</p>
        <p class="quiz-stake ${attempts === 0 ? "good" : "low"}">${attempts === 0 ? "⭐ +5 XP" : "😅 +2 XP now"}</p>
      </div>
      <div class="builder-answer" id="answer-row"></div>
      <div class="builder-pool" id="pool"></div>
    </div>`;
  const row = document.getElementById("answer-row");
  if (placedIDs.length === 0) {
    row.innerHTML = `<span class="builder-blank">${s.wordIDs.map(() => "___").join(" ")}।</span>`;
  } else {
    placedIDs.forEach(id => {
      const w = byID[id];
      if (!w) return;
      const tile = document.createElement("button");
      tile.className = "builder-tile placed";
      tile.innerHTML = `<span class="opt-deva">${esc(w.devanagari)}</span><span class="opt-sub">${esc(w.romanized)}</span>`;
      tile.disabled = solved;
      if (!solved) tile.addEventListener("click", () => unplace(id));
      row.appendChild(tile);
    });
    if (placedIDs.length === s.wordIDs.length) {
      const dot = document.createElement("span");
      dot.className = "builder-dot";
      dot.textContent = "।";
      row.appendChild(dot);
    }
  }
  const pool = document.getElementById("pool");
  poolIDs.forEach(id => {
    const w = byID[id];
    if (!w) return;
    const tile = document.createElement("button");
    tile.className = "builder-tile";
    tile.innerHTML = `<span class="opt-deva">${esc(w.devanagari)}</span><span class="opt-sub">${esc(w.romanized)}</span>`;
    tile.addEventListener("click", () => place(id));
    pool.appendChild(tile);
  });
}
GharAuth.pull().catch(() => {}).then(() => GharAuth.refreshUnlock().catch(() => false)).then(() => fetch("data/nepal-v1.json?v=4"))
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(pack => {
    xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
    const content = document.getElementById("content");
    // Server unlock (Stripe $7.99) opens the Builder, same as TEST.
    if (!TEST && !GharAuth.isUnlocked()) {
      content.innerHTML = `<div class="quiz-lock"><div class="big">🔒</div><h1>Sentence Builder</h1><p>This unlocks with Ghar Premium.</p></div>`;
      return;
    }
    pack.decks.forEach(d => d.words.forEach(w => { byID[w.id] = w; }));
    const missing = ROUNDS.flat().flatMap(s => s.wordIDs).filter(id => !byID[id]);
    if (missing.length) throw new Error("missing words: " + missing.join(","));
    startSession();
  })
  .catch(() => { document.getElementById("error").hidden = false; });
</script>
