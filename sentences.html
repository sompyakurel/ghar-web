<script>
function isTestUnlock() {
  const q = new URLSearchParams(location.search);
  localStorage.removeItem("ghar.testUnlock"); // ?test bypass removed 2026-11-16 (payments live)
  return false;
}
const TEST = isTestUnlock();
function asset(u) {
  if (!u) return "";
  return u.replace(/^\/images\/nepal-v1\//, "assets/images/")
          .replace(/^\/audio\/nepal-v1\//, "assets/audio/nepal-v1/");
}
let xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
function saveXP() { localStorage.setItem("ghar.xp.total", String(xp)); }
// The balance this page shows is the spendable wallet (lifetime minus
// what has been spent), matching the home page, the map and the shop -
// xp above stays the lifetime total that awards keep adding to.
function dispXP() {
  if (window.GharAuth && GharAuth.spendable) return GharAuth.spendable();
  return Math.max(xp - (parseInt(localStorage.getItem("ghar.xp.spent") || "0", 10) || 0), 0);
}
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playDing() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [[880, 0.25], [1318, 0.12]].forEach(([freq, vol]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(g).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.9);
    });
  } catch (e) {}
}
const WRONG_CLIPS = ["feedback_vayena_1_np.m4a", "feedback_vayena_2_np.m4a"];
const feedbackPlayer = new Audio();
function playWrongFeedback() {
  const file = WRONG_CLIPS[Math.floor(Math.random() * WRONG_CLIPS.length)];
  feedbackPlayer.pause();
  feedbackPlayer.src = "assets/audio/nepal-v1/" + file;
  feedbackPlayer.play().catch(() => {});
}
const player = new Audio();
// Sentence patterns for the Build-a-Sentence game (2026-11-17: grew
// from the single यो ___ हो। pattern to four). Each pattern draws its
// blank from a pool of pack words that fit it; a run samples 3 words
// per pattern, shuffled. The spoken question clip exists only for
// the first pattern, so only it sets clip: true.
const PATTERNS = [
  { prefix: "यो", suffix: "हो।", hintEn: "This is a ___", clip: true,
    ids: ["kitab", "kukur", "biralo", "chara", "syau", "kera", "haatti", "baandar", "ghoda", "bagh", "maachha", "kharayo", "suntala", "bhuinkatahar", "gaai", "bakhra"] },
  { prefix: "मलाई", suffix: "मन पर्छ।", hintEn: "I like ___", clip: false,
    ids: ["syau", "kera", "suntala", "bhuinkatahar", "kagati", "kukur", "biralo", "chara", "maachha"] },
  { prefix: "म", suffix: "देख्छु।", hintEn: "I see a ___", clip: false,
    ids: ["haatti", "baandar", "ghoda", "bagh", "gaai", "bakhra", "kharayo", "kukur", "biralo", "chara"] },
  { prefix: "यो मेरो", suffix: "हो।", hintEn: "This is my ___", clip: false,
    ids: ["haat", "khutta", "mukh", "naak", "kaan", "aankha", "tauko", "pet", "dhaad", "aunla", "daant", "kapaal"] },
];
// Everyday phrases (2026-11-17) — real things a kid says to family.
// The same phrases are pinned in the backend's Bhunte facts, so
// "how do you say I am hungry?" gets this exact answer.
const PHRASES = [
  { title: "👋 Meeting & greeting", items: [
    { deva: "नमस्ते", rom: "Namaste", en: "Hello" },
    { deva: "शुभ प्रभात", rom: "Shubha prabhat", en: "Good morning" },
    { deva: "शुभ रात्रि", rom: "Shubha ratri", en: "Good night" },
    { deva: "तपाईंलाई कस्तो छ?", rom: "Tapailai kasto chha?", en: "How are you?" },
    { deva: "मलाई ठिक छ", rom: "Malai thik chha", en: "I am fine" },
    { deva: "फेरि भेटौंला", rom: "Pheri bhetaula", en: "See you again" },
  ]},
  { title: "🙋 About me", items: [
    { deva: "मेरो नाम ___ हो", rom: "Mero naam ___ ho", en: "My name is ___" },
    { deva: "म अमेरिकामा बस्छु", rom: "Ma America-ma baschhu", en: "I live in America" },
    { deva: "म नेपाली सिक्दै छु", rom: "Ma Nepali sikdai chhu", en: "I am learning Nepali" },
    { deva: "मलाई नेपाली मन पर्छ", rom: "Malai Nepali man parchha", en: "I like Nepali" },
  ]},
  { title: "🏠 At home", items: [
    { deva: "मलाई भोक लाग्यो", rom: "Malai bhok lagyo", en: "I am hungry" },
    { deva: "मलाई तिर्खा लाग्यो", rom: "Malai tirkha lagyo", en: "I am thirsty" },
    { deva: "मलाई पानी चाहियो", rom: "Malai pani chahiyo", en: "I need water" },
    { deva: "मलाई भात खान मन छ", rom: "Malai bhat khana man chha", en: "I want to eat rice" },
    { deva: "म सुत्न जान्छु", rom: "Ma sutna janchhu", en: "I am going to sleep" },
    { deva: "एक छिन पर्खनुहोस्", rom: "Ek chhin parkhanuhos", en: "Please wait a moment" },
  ]},
  { title: "💛 Polite words", items: [
    { deva: "धन्यवाद", rom: "Dhanyabad", en: "Thank you" },
    { deva: "हजुरआमालाई धन्यवाद", rom: "Hajuraamalai dhanyabad", en: "Thank you, grandmother" },
    { deva: "कृपया", rom: "Kripaya", en: "Please" },
    { deva: "माफ गर्नुहोस्", rom: "Maaf garnuhos", en: "Excuse me / sorry" },
    { deva: "हुन्छ", rom: "Hunchha", en: "Okay" },
  ]},
  { title: "😊 Feelings", items: [
    { deva: "म खुशी छु", rom: "Ma khushi chhu", en: "I am happy" },
    { deva: "मलाई दुःख लाग्यो", rom: "Malai dukha lagyo", en: "I am sad" },
    { deva: "मलाई तपाईं मन पर्छ", rom: "Malai tapai man parchha", en: "I like you" },
    { deva: "म तपाईंलाई माया गर्छु", rom: "Ma tapailai maya garchhu", en: "I love you" },
  ]},
];
let mode = "phrases";
let started = false;
let byID = {};
function tabsHTML(active) {
  return `<div class="sent-tabs">
    <button class="sent-tab${active === "phrases" ? " on" : ""}" data-mode="phrases" type="button">🗣️ Phrases</button>
    <button class="sent-tab${active === "game" ? " on" : ""}" data-mode="game" type="button">🎮 Build-a-Sentence</button>
  </div>`;
}
function wireTabs() {
  document.querySelectorAll(".sent-tab").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.mode === "phrases") renderPhrases();
    else if (!started) { started = true; dealQuestion(); }
    else { mode = "game"; render(); }
  }));
}
function renderPhrases() {
  mode = "phrases";
  const content = document.getElementById("content");
  let h = tabsHTML("phrases") + `<h1 class="phr-title">🗣️ Everyday Phrases</h1><p class="phr-sub">Real sentences to say to your family — read them out loud together.</p>`;
  PHRASES.forEach(g => {
    h += `<h2 class="phr-group">${esc(g.title)}</h2><div class="phr-grid">`;
    g.items.forEach(ph => {
      h += `<div class="phr-card"><div class="phr-deva">${esc(ph.deva)}</div><div class="phr-rom">${esc(ph.rom)}</div><div class="phr-en">${esc(ph.en)}</div></div>`;
    });
    h += `</div>`;
  });
  content.innerHTML = h;
  wireTabs();
}
function buildRun() {
  const run = [];
  PATTERNS.forEach(pat => {
    pat.words = pat.ids.map(id => byID[id]).filter(Boolean);
    shuffle([...pat.words]).slice(0, 3).forEach(w => run.push({ pictureWord: w, pattern: pat }));
  });
  return run;
}
let questions = [];
let order = [];
let index = 0;
let options = [];
let picked = null;
let wrongPicks = new Set();
let correctCount = 0;
let earnedXP = 0;
let finished = false;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function current() { return questions[order[index]]; }
// Ask "यो के हो?" (What is this?) in Som's Nepali voice when a question
// is dealt — on open and on every new picture, since that is the question.
function askYoKeHo() {
  player.pause();
  player.src = "assets/audio/bhunte/sent_yo_ke_ho_np.m4a";
  player.play().catch(() => {});
}
function dealQuestion() {
  picked = null;
  wrongPicks = new Set();
  const q = current();
  const pool = q.pattern.words.filter(w => w.id !== q.pictureWord.id);
  const distractors = shuffle([...pool]).slice(0, 2);
  options = shuffle([q.pictureWord, ...distractors]);
  mode = "game";
  render();
  if (q.pattern.clip) askYoKeHo();
}
function render() {
  const content = document.getElementById("content");
  if (finished) {
    content.innerHTML = tabsHTML("game") + `
      <div class="sent-done">
        <div class="sent-done-emoji">🎉</div>
        <h1>You built sentences!</h1>
        <p>+${earnedXP} XP · ${correctCount}/${questions.length} correct</p>
        <p class="sent-done-sub">This is a ___, I like ___, I see a ___, this is my ___ — real Nepali sentences!</p>
        <button class="quiz-next" id="again">Play again</button>
      </div>`;
    document.getElementById("again").addEventListener("click", () => {
      index = 0; correctCount = 0; earnedXP = 0; finished = false;
      questions = buildRun();
      order = shuffle(questions.map((_, i) => i));
      dealQuestion();
    });
    wireTabs();
    return;
  }
  const q = current();
  const pic = q.pictureWord.image
    ? `<img class="sent-picture" src="${esc(asset(q.pictureWord.image))}" alt="${esc(q.pictureWord.english)}" onerror="this.style.display='none'">`
    : `<div class="sent-picture sent-picture-fallback">${esc(q.pictureWord.devanagari)}</div>`;
  content.innerHTML = tabsHTML("game") + `
    <div class="quiz-player">
      <h1>📝 Build a Sentence</h1>
      <p class="sent-pattern">${esc(q.pattern.hintEn)}</p>
      <p class="quiz-xp">⭐ ${dispXP()} XP · ${index + 1} / ${questions.length}</p>
      <div class="progress"><div style="width:${(index / questions.length * 100)}%"></div></div>
      ${pic}
      <p class="sent-line"><span>${esc(q.pattern.prefix)}</span> ${picked ? `<span class="sent-filled">${esc(picked.devanagari)}</span>` : `<span class="sent-blank">___</span>`} <span>${esc(q.pattern.suffix)}</span></p>
      ${picked ? "" : `<p class="sent-hint">Tap the missing word</p>`}
      <p class="quiz-stake ${wrongPicks.size === 0 ? "good" : "low"}">${wrongPicks.size === 0 ? "⭐ +5 XP" : "😅 +2 XP now"}</p>
      <div class="sent-options" id="opts"></div>
      ${picked ? `<button class="quiz-next" id="next">Next →</button>` : ""}
    </div>`;
  const optsEl = document.getElementById("opts");
  options.forEach(w => {
    const isWrong = wrongPicks.has(w.id);
    const btn = document.createElement("button");
    btn.className = "sent-option" + (isWrong ? " wrong" : "");
    btn.disabled = picked !== null || isWrong;
    btn.innerHTML = `<span class="opt-deva">${esc(w.devanagari)}</span><span class="opt-sub">${esc(w.romanized)}</span>`;
    btn.addEventListener("click", () => pick(w));
    optsEl.appendChild(btn);
  });
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => {
    if (index + 1 < questions.length) { index += 1; dealQuestion(); }
    else { finished = true; render(); }
  });
  wireTabs();
}
function pick(w) {
  const q = current();
  if (w.id === q.pictureWord.id) {
    picked = w;
    correctCount += 1;
    const earned = wrongPicks.size === 0 ? 5 : 2;
    xp += earned;
    earnedXP += earned;
    saveXP();
    if (window.GharAuth && GharAuth.addBones) GharAuth.addBones(earned);
    GharAuth.pushTotals().catch(() => {});
    if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(() => {});
    playDing();
    if (w.has_audio && w.audio_url) {
      player.pause();
      player.src = asset(w.audio_url);
      player.play().catch(() => {});
    }
    render();
  } else {
    wrongPicks.add(w.id);
    playWrongFeedback();
    render();
  }
}
GharAuth.pull().catch(() => {}).then(() => GharAuth.refreshUnlock().catch(() => false)).then(() => fetch("data/nepal-v1.json?v=6"))
  .then(r => { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(pack => {
    xp = parseInt(localStorage.getItem("ghar.xp.total") || "0", 10);
    const content = document.getElementById("content");
    // Server unlock (Stripe $7.99) opens Premium sentences, same as TEST.
    if (!TEST && !GharAuth.isUnlocked()) {
      content.innerHTML = `<div class="quiz-lock"><div class="big">🔒</div><h1>Sentences</h1><p>This unlocks with Ghar Premium.</p></div>`;
      return;
    }
    byID = {};
    pack.decks.forEach(d => d.words.forEach(w => { byID[w.id] = w; }));
    questions = buildRun();
    if (questions.length < 3) throw new Error("not enough words");
    order = shuffle(questions.map((_, i) => i));
    started = true;
    dealQuestion();
  })
  .catch(() => { document.getElementById("error").hidden = false; });
</script>
