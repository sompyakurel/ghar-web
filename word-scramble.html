<script>
(function () {
  // ---- Sound & music (Web Audio, synthesized — no files, no copyright) ----
  var audioCtx = null, musicGain = null, sfxGain = null, delaySend = null;
  var musicOn = localStorage.getItem('ghar.scramble.music') !== '0';
  var sfxOn = localStorage.getItem('ghar.scramble.sounds') !== '0';
  var musicTimer = null, musicStep = 0, nextStepTime = 0;
  var droneOsc = null, droneGain = null;
  var MEL = [329.63, 392.00, 440.00, 392.00, 329.63, 293.66, 261.63, 293.66, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 293.66, 0];
  var STEP = 60 / 76 / 2;

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      musicGain = audioCtx.createGain(); musicGain.gain.value = 0.14; musicGain.connect(audioCtx.destination);
      sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(audioCtx.destination);
      var delay = audioCtx.createDelay(1); delay.delayTime.value = 0.27;
      var fb = audioCtx.createGain(); fb.gain.value = 0.32;
      var wet = audioCtx.createGain(); wet.gain.value = 0.3;
      delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(musicGain);
      delaySend = delay;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return true;
  }
  function playNote(freq, when, dur, type, vol, dest) {
    var o = audioCtx.createOscillator();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g);
    g.connect(dest || musicGain);
    if (dest === musicGain && delaySend) g.connect(delaySend);
    o.start(when); o.stop(when + dur + 0.05);
  }
  function scheduleMusic() {
    if (!musicOn || !audioCtx) return;
    var ahead = audioCtx.currentTime + 0.35;
    while (nextStepTime < ahead) {
      var step = musicStep % 16;
      var f = MEL[step];
      if (f) playNote(f, nextStepTime, STEP * 1.8, 'triangle', 0.5, musicGain);
      if (step % 4 === 0) {
        var bf = (step === 0 || step === 8) ? 130.81 : 98.00;
        playNote(bf, nextStepTime, STEP * 3.2, 'sine', 0.4, musicGain);
      }
      nextStepTime += STEP;
      musicStep++;
    }
  }
  function startDrone() {
    if (droneOsc || !audioCtx) return;
    droneOsc = audioCtx.createOscillator(); droneOsc.type = 'sine'; droneOsc.frequency.value = 65.41;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0.0;
    droneGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);
    droneOsc.connect(droneGain); droneGain.connect(musicGain);
    droneOsc.start();
  }
  function stopDrone() {
    if (!droneOsc) return;
    var o = droneOsc, g = droneGain; droneOsc = null; droneGain = null;
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    o.stop(audioCtx.currentTime + 0.5);
  }
  function startMusic() {
    if (!ensureAudio() || !musicOn) return;
    if (musicTimer) return;
    nextStepTime = audioCtx.currentTime + 0.08;
    musicStep = 0;
    musicTimer = setInterval(scheduleMusic, 90);
    startDrone();
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    stopDrone();
  }
  function sfxTap() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(520, t, 0.06, 'triangle', 0.35, sfxGain);
  }
  function sfxCorrect() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(880, t, 0.25, 'triangle', 0.5, sfxGain);
    playNote(1318.5, t + 0.1, 0.3, 'triangle', 0.4, sfxGain);
  }
  function sfxWrong() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    playNote(196, t, 0.22, 'sine', 0.45, sfxGain);
    playNote(147, t + 0.12, 0.25, 'sine', 0.4, sfxGain);
  }
  function sfxWin() {
    if (!sfxOn || !ensureAudio()) return;
    var t = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { playNote(f, t + i * 0.13, 0.3, 'triangle', 0.5, sfxGain); });
  }
  function refreshToggles() {
    var m = document.getElementById('btn-music');
    var s = document.getElementById('btn-sound');
    m.textContent = musicOn ? '🎵 Music: On' : '🎵 Music: Off';
    s.textContent = sfxOn ? '🔊 Sounds: On' : '🔇 Sounds: Off';
    m.classList.toggle('off', !musicOn);
    s.classList.toggle('off', !sfxOn);
  }

  // ---- Game ----
  var VIRAMA = '्'; // U+094D — conjuncts break clean tile splitting, so skip them
  var ROUNDS = 5;
  var DAILY_CAP = 30;
  var diff = 'easy';
  var pack = null;
  var words = [];        // the 5 words for this game
  var roundIdx = 0;      // 0-based
  var correct = 0, gameXp = 0;
  var current = null;    // word object for this round
  var letters = [];      // non-space graphemes of the current word, in order
  var tiles = [];        // {ch, id, used}
  var slots = [];        // {space: bool, tileId: number|null}
  var missed = false;    // this word had a wrong attempt (correct pays +2, not +5)
  var checking = false;
  var audioEl = null;

  var slotsEl = document.getElementById('ws-slots');
  var trayEl = document.getElementById('ws-tray');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2500);
  }

  function asset(p) {
    if (!p) return '';
    return p.replace(/^\/images\/nepal-v1\//, 'assets/images/').replace(/^\/audio\/nepal-v1\//, 'assets/audio/nepal-v1/');
  }

  // Split Devanagari into graphemes: a base character + its combining marks.
  // (Matches how the difficulty bands were computed.)
  function graphemes(s) {
    var m = s.match(/\P{M}\p{M}*/gu);
    return m || [];
  }

  function letterCount(w) {
    return graphemes(w.devanagari).filter(function (g) { return g !== ' '; }).length;
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickWords() {
    var pool = [];
    var seenDev = {};
    pack.decks.forEach(function (d) {
      d.words.forEach(function (w) {
        if (!w.image || !w.has_audio) return;
        if (d.id === 'alphabet') return;          // single letters can't scramble
        if (w.devanagari.indexOf(VIRAMA) >= 0) return;
        if (seenDev[w.devanagari]) return;          // same spelling = same puzzle
        var n = letterCount(w);
        if (n < 2) return;
        if (diff === 'easy' && n > 3) return;
        if (diff === 'med' && (n < 4 || n > 5)) return;
        if (diff === 'hard' && n < 6) return;
        seenDev[w.devanagari] = true;
        pool.push(w);
      });
    });
    return shuffle(pool).slice(0, ROUNDS);
  }

  function playWordAudio() {
    if (!current) return;
    var url = asset(current.audio_url);
    if (!url) return;
    if (!audioEl) audioEl = new Audio();
    audioEl.pause();
    audioEl.src = url;
    audioEl.play().catch(function () {});
  }

  function renderSlots() {
    slotsEl.innerHTML = '';
    slotsEl.classList.remove('correct', 'wrong');
    slots.forEach(function (s, i) {
      var d = document.createElement('div');
      if (s.space) {
        d.className = 'ws-slot gap';
      } else {
        d.className = 'ws-slot' + (s.tileId !== null ? ' filled' : '');
        d.textContent = s.tileId !== null ? tiles[s.tileId].ch : '';
        d.addEventListener('click', function () { unplace(i); });
      }
      slotsEl.appendChild(d);
    });
  }

  function renderTray() {
    trayEl.innerHTML = '';
    tiles.forEach(function (t, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ws-tile' + (t.used ? ' used' : '');
      b.textContent = t.ch;
      b.addEventListener('click', function () { place(i); });
      trayEl.appendChild(b);
    });
  }

  function place(tileIdx) {
    if (checking) return;
    var t = tiles[tileIdx];
    if (t.used) return;
    // Fill the first empty letter slot.
    for (var i = 0; i < slots.length; i++) {
      if (!slots[i].space && slots[i].tileId === null) {
        slots[i].tileId = tileIdx;
        t.used = true;
        sfxTap();
        renderSlots();
        renderTray();
        maybeCheck();
        return;
      }
    }
  }

  function unplace(slotIdx) {
    if (checking) return;
    var s = slots[slotIdx];
    if (s.space || s.tileId === null) return;
    tiles[s.tileId].used = false;
    s.tileId = null;
    sfxTap();
    renderSlots();
    renderTray();
  }

  function clearAnswer() {
    slots.forEach(function (s) {
      if (!s.space && s.tileId !== null) { tiles[s.tileId].used = false; s.tileId = null; }
    });
    renderSlots();
    renderTray();
  }

  function maybeCheck() {
    var filled = slots.every(function (s) { return s.space || s.tileId !== null; });
    if (!filled) return;
    checking = true;
    setTimeout(function () {
      var got = slots.filter(function (s) { return !s.space; }).map(function (s) { return tiles[s.tileId].ch; }).join('');
      var want = letters.join('');
      if (got === want) onCorrect(); else onWrong();
    }, 300);
  }

  function onCorrect() {
    slotsEl.classList.add('correct');
    sfxCorrect();
    confettiBurst();
    correct++;
    var xp = awardXp(missed ? 2 : 5);
    gameXp += xp;
    updateScore();
    setTimeout(nextRound, 1300);
  }

  function onWrong() {
    slotsEl.classList.add('wrong');
    sfxWrong();
    missed = true;
    setTimeout(function () {
      checking = false;
      clearAnswer();
    }, 600);
  }

  function awardXp(base) {
    var today = new Date().toISOString().slice(0, 10);
    var day = localStorage.getItem('ghar.scramble.day');
    var used = parseInt(localStorage.getItem('ghar.scramble.xpToday') || '0', 10);
    if (day !== today) { day = today; used = 0; }
    var room = DAILY_CAP - used;
    if (room <= 0) return 0;
    var xp = Math.min(base, room);
    var total = parseInt(localStorage.getItem('ghar.xp.total') || '0', 10) + xp;
    localStorage.setItem('ghar.xp.total', String(total));
    localStorage.setItem('ghar.scramble.day', day);
    localStorage.setItem('ghar.scramble.xpToday', String(used + xp));
    if (window.GharAuth) {
      GharAuth.pushTotals().catch(function () {});
      if (GharAuth.shareLeaderboard) GharAuth.shareLeaderboard().catch(function () {});
    }
    return xp;
  }

  function updateScore() {
    document.getElementById('ws-score').textContent = '✅ ' + correct + ' correct · ⭐ ' + gameXp + ' XP this game';
  }

  function loadRound() {
    current = words[roundIdx];
    missed = false;
    checking = false;
    var g = graphemes(current.devanagari);
    letters = g.filter(function (x) { return x !== ' '; });
    slots = g.map(function (x) { return x === ' ' ? { space: true, tileId: null } : { space: false, tileId: null }; });
    // Shuffle the letters until the order differs from the answer.
    var order = letters.slice();
    for (var tries = 0; tries < 12; tries++) {
      order = shuffle(letters);
      if (order.join('') !== letters.join('')) break;
    }
    tiles = order.map(function (ch, i) { return { ch: ch, id: i, used: false }; });
    document.getElementById('ws-progress').textContent = 'Word ' + (roundIdx + 1) + ' of ' + ROUNDS;
    document.getElementById('ws-bar-fill').style.width = ((roundIdx) / ROUNDS * 100) + '%';
    document.getElementById('ws-pic').src = asset(current.image);
    document.getElementById('ws-pic').alt = current.english || '';
    document.getElementById('ws-en').textContent = current.english || '';
    renderSlots();
    renderTray();
    playWordAudio();
  }

  function nextRound() {
    roundIdx++;
    if (roundIdx >= ROUNDS) { endGame(); return; }
    document.getElementById('ws-bar-fill').style.width = ((roundIdx) / ROUNDS * 100) + '%';
    loadRound();
  }

  function endGame() {
    sfxWin();
    confettiBurst();
    document.getElementById('win-stats').textContent =
      (diff === 'easy' ? 'Easy' : diff === 'med' ? 'Medium' : 'Hard') +
      ' · ' + correct + ' of ' + ROUNDS + ' words correct';
    document.getElementById('win-xp').textContent = gameXp > 0 ? '⭐ +' + gameXp + ' XP' : 'No more XP for Word Scramble today — come back tomorrow!';
    var bestKey = 'ghar.scramble.best.' + diff;
    var best = parseInt(localStorage.getItem(bestKey) || '0', 10);
    var bestMsg = '';
    if (correct > best) {
      localStorage.setItem(bestKey, String(correct));
      bestMsg = '🏆 New best for ' + (diff === 'easy' ? 'Easy' : diff === 'med' ? 'Medium' : 'Hard') + '!';
    } else {
      bestMsg = 'Best for ' + (diff === 'easy' ? 'Easy' : diff === 'med' ? 'Medium' : 'Hard') + ': ' + best + ' of ' + ROUNDS;
    }
    document.getElementById('win-best').textContent = bestMsg;
    document.getElementById('ws-win').hidden = false;
  }

  function confettiBurst() {
    var colors = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#fb8c00', '#7e57c2', '#ec407a'];
    for (var i = 0; i < 40; i++) {
      var d = document.createElement('div');
      d.className = 'confetti';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.background = colors[i % colors.length];
      d.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      d.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(d);
      (function (el) { setTimeout(function () { el.remove(); }, 3600); })(d);
    }
  }

  function startGame(d) {
    diff = d;
    roundIdx = 0; correct = 0; gameXp = 0;
    document.getElementById('ws-win').hidden = true;
    document.getElementById('mode-pick').hidden = true;
    document.getElementById('game').hidden = false;
    document.getElementById('ws-bar-fill').style.width = '0%';
    updateScore();
    refreshToggles();
    startMusic();
    if (!pack) {
      document.getElementById('ws-loading').hidden = false;
      document.getElementById('ws-card').hidden = true;
      fetch('data/nepal-v1.json?v=2').then(function (r) { return r.json(); }).then(function (j) {
        pack = j;
        document.getElementById('ws-loading').hidden = true;
        document.getElementById('ws-card').hidden = false;
        words = pickWords();
        loadRound();
      }).catch(function () {
        document.getElementById('ws-loading').textContent = 'Couldn\'t load the words. Check your connection and refresh.';
      });
    } else {
      document.getElementById('ws-card').hidden = false;
      words = pickWords();
      loadRound();
    }
  }

  document.getElementById('mode-easy').addEventListener('click', function () { startGame('easy'); });
  document.getElementById('mode-med').addEventListener('click', function () { startGame('med'); });
  document.getElementById('mode-hard').addEventListener('click', function () { startGame('hard'); });
  document.getElementById('btn-new').addEventListener('click', function () { startGame(diff); });
  document.getElementById('btn-again').addEventListener('click', function () { startGame(diff); });
  function backToModes() {
    document.getElementById('game').hidden = true;
    document.getElementById('ws-win').hidden = true;
    document.getElementById('mode-pick').hidden = false;
  }
  document.getElementById('btn-mode').addEventListener('click', backToModes);
  document.getElementById('btn-win-mode').addEventListener('click', backToModes);
  document.getElementById('btn-hear').addEventListener('click', playWordAudio);
  document.getElementById('btn-shuffle').addEventListener('click', function () {
    if (checking) return;
    // Re-shuffle only the tiles that aren't placed yet.
    var free = tiles.filter(function (t) { return !t.used; }).map(function (t) { return t.ch; });
    free = shuffle(free);
    var fi = 0;
    tiles.forEach(function (t) { if (!t.used) { t.ch = free[fi++]; } });
    sfxTap();
    renderTray();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    if (checking) return;
    clearAnswer();
  });
  document.getElementById('btn-skip').addEventListener('click', function () {
    if (checking) return;
    checking = true;
    setTimeout(nextRound, 150);
  });
  document.getElementById('btn-music').addEventListener('click', function () {
    musicOn = !musicOn;
    localStorage.setItem('ghar.scramble.music', musicOn ? '1' : '0');
    if (musicOn) startMusic(); else stopMusic();
    refreshToggles();
  });
  document.getElementById('btn-sound').addEventListener('click', function () {
    sfxOn = !sfxOn;
    localStorage.setItem('ghar.scramble.sounds', sfxOn ? '1' : '0');
    refreshToggles();
    if (sfxOn) sfxTap();
  });

  if (window.GharAuth) GharAuth.pull().catch(function () {});
})();
</script>
</body>
</html>
